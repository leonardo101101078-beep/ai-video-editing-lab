<!doctype html>
<!--
  剪辑术语与效果对照目录（单档、离线、无外部依赖）

  【后续扩充规则】
  - 新术语只加一个对象到 TERMS（字段：id, cat, zh, en, alias, desc, use, demo, ref, prompt{hf,hfZh,hyper,jy,tested}）。
  - 新 demo：加一组 @keyframes + `.play .a-<名称>` 样式，再到 DEMO 表加一个 builder；
    静态近似示意加到 STILL 表；剪接时间线图加到 TL 表。TERMS 里的 demo 字段填那个名称
    （静态填 "still:<名>"，时间线填 "tl:<名>"）。
  - 打光卡 light 型可加 img:"media/light/<id>.png"：左 45% 放真人照片（Nano Banana 生成），右 55% 放球体＋俯视图；文件缺失时左侧退回渐变底。
  - AI 查表：改完 TERMS 后执行 `node 說明文件/gen_glossary_md.js` 重新生成 說明文件/剪辑术语目录.md。
  - Higgsfield 实测后把 tested 改成 tested / fail；好片存 Higgsfield/术语示例/<id>.mp4，
    并在对象加 clip:"media/<id>.mp4"；render 时有 clip 则优先放 <video>。
  - prompt.jy 的预设名来自 jianying-local 实际查询（2026-10-01）：
    motion presets = zoom_in 缓慢推近 / zoom_out 缓慢拉远 / pan_left / pan_right / slide_up / slide_down / fade_in / fade_out / pulse；
    native = 视频渐显·渐隐、文字渐显·渐隐、转场 叠化·左移·右移。其余写「剪映内手动：菜单路径」（路径以 11.5 实际菜单为准）。
  - prompt.hyper 与 HyperFrames經驗筆記 第二、三節一致：只动 transform / opacity / filter（动 letterSpacing 会触发 gsap_non_transform_motion），
    时间用 GSAP timeline 的秒数。

  【v2 追加规则】
  - demo 型别 `light:<名>`：球体（CSS radial-gradient 受光面＋鼻影）＋俯视佈光图（SVG：相机、主体、灯位与角度）。
    参数写在 LIGHT 表：L=[类型 k主/f补/r轮廓/w窗/c反光板, 方位角 az（0=相机正前，+90=画面右侧，180=主体正后）, 仰角 el(-1..1), 强度, 大小倍率, 颜色]；
    hard=0..1 硬软；turn=-1/1 头部转向；shape:'obj' 产品形；bg: dark/bright/window；cmp:1 双球硬软对比。golden-hour/neon/volumetric 仍用 still。
  - 分类 `comp` 去背合成：两层 div（前景人形剪影 .sil＋背景）演示；jy 写剪映菜单路径并标「11.5 待核对」。
  - mg 的数据／产品说明字卡可加 `tag:"数据图表"` 或 `tag:"产品说明"`，卡片上显示为小标签。
  - ★ 收藏：每卡右上角 ☆/★，id 数组存 localStorage['glossary-fav']（try/catch 包住）；首个 tab「★ 收藏」带数量，可与搜索叠加；
    收藏 tab 内有「复制收藏清单」按钮（每行 中文 / English，用 navigator.clipboard，失败退回 textarea 选取）。

  【v3 追加规则】
  - 分类顺序 = CATS 顺序：fav, all, camera, light, mg, transition, comp, subtitle, font, size, beauty, shot, color, cut, fx, rhythm。
    render()「全部」视图按 CATS 做稳定排序，gen_glossary_md.js 按 CATS 输出章节；TERMS 区块不必搬动，新类追加在数组末尾即可。
  - 新分类 size 尺寸 / font 字体 / beauty 美颜修图，各 12 条，新 demo 型别：
    `size:<名>`（sizeDemo：按比例画框＋尺寸标注；safe 画上/下/右 UI 遮挡带；bars/fit 用占位图；SZ 表放比例）、
    `font:<名>`（fontDemo：用 macOS 系统字体堆叠 PingFang SC／Songti SC／Kaiti SC／Yuanti SC 的实际样张，权重/字距/行距做 A/B）、
    `beauty:<名>`（beautyDemo：media/light/front-flat.png 前后对比滑杆，右半用 CSS filter 近似，标「近似示意」；图缺失时退回渐变底；BEAUTY 表放滤镜参数）。
  - 美颜 tab 顶部有 .catnote 说明：剪映 MCP 目前没有任何美颜参数，jy 一律写「MCP 不支持自动美颜；剪映内手动：画面→美颜美体→<项>（11.5 待核对）」。
  - 字体类 jy 以 2026-10-01 查到的 schema 为准：create_draft 文字 clip 有 font_size／color／x／y；style_subtitles 的 style 有 font_size／color／x／y；
    set_clip_features.text_style 有 bold／italic／stroke／shadow／letter_spacing／line_spacing 等；三者都没有「字体名」参数。
-->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>剪辑术语目录</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--tx:#e8eaf0;--mut:#9aa3b2;--ac:#ffb454;--ac2:#6cb6ff;
--ph:url("../Higgsfield/素材库/04_场景图/咖啡馆_手机扫码_竖版AI_05.png")}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.96);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:18px;margin:0 0 8px}
#q{width:100%;max-width:520px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:#12151b;color:var(--tx);font-size:15px}
#tabs{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
#tabs button{border:1px solid var(--line);background:#12151b;color:var(--mut);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:13px}
#tabs button.on{background:var(--ac);color:#1a1205;border-color:var(--ac)}
#cnt{color:var(--mut);font-size:12px;margin-left:6px}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h2{font-size:16px;margin:0}.card h2 small{color:var(--ac2);font-weight:500;font-size:13px;margin-left:6px}
.catn{color:var(--mut);font-size:11px}
.chips{margin:6px 0}.chips span{display:inline-block;background:#232834;color:var(--mut);padding:1px 8px;border-radius:999px;font-size:11px;margin:0 4px 4px 0}
.desc{margin:6px 0;color:#cfd3dc}.use{color:var(--mut);font-size:13px}.use b{color:var(--ac)}
.demowrap{margin:10px 0 6px}
.demo{position:relative;width:320px;max-width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:linear-gradient(135deg,#2a2f3a,#14171d);border:1px solid var(--line)}
.demo video{width:100%;height:100%;object-fit:cover}
.rep{margin-top:6px;border:1px solid var(--line);background:#12151b;color:var(--tx);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px}
.rep:hover{border-color:var(--ac)}
details{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
summary{cursor:pointer;color:var(--ac);font-size:13px}
.pr{margin:6px 0}.pr .k{font-size:11px;color:var(--ac2)}.pr code{display:block;white-space:pre-wrap;word-break:break-word;background:#0c0e12;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:12px/1.5 ui-monospace,Menlo,monospace;color:#d6dae3}
.tg{font-size:11px;color:var(--mut)}
.refs{margin-top:8px;font-size:12px;color:var(--mut)}.refs a{color:var(--ac2);margin-right:10px;text-decoration:none}.refs a:hover{text-decoration:underline}
.empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:40px}
@media(max-width:420px){main{padding:10px;grid-template-columns:1fr}.demo{width:100%}}

/* ===== demo 共用 ===== */
.lay{position:absolute;inset:0}
.img{background:var(--ph) center/cover no-repeat,linear-gradient(135deg,#5a3d2a,#1b2b3d)}
.img.b{filter:hue-rotate(150deg) saturate(1.3)}
.stage{perspective:520px;overflow:hidden}
.badge{position:absolute;right:6px;top:6px;z-index:5;font-size:10px;background:rgba(0,0,0,.6);color:#ffd9a0;padding:1px 6px;border-radius:4px}
.ctr{display:flex;align-items:center;justify-content:center}
.txt{font-size:28px;font-weight:800;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);letter-spacing:1px}
.dim{filter:brightness(.55)}
.cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:19px;font-weight:700;color:#fff;text-shadow:0 2px 6px #000}
.cap span{display:inline-block}
.ball{position:absolute;left:0;width:22px;height:22px;border-radius:50%;background:var(--ac)}
.track{position:absolute;left:12px;right:12px;height:24px;border-bottom:1px solid #3a4150}
.track em{position:absolute;left:0;top:-14px;font-size:10px;color:#9aa3b2;font-style:normal}
.fig{position:absolute;left:50%;top:50%;width:70px;height:110px;margin:-55px 0 0 -35px;border-radius:35px 35px 6px 6px;background:linear-gradient(#ffb454,#d9703a)}
.blk{position:absolute;width:90px;height:90px;border-radius:10px;top:45px;font:700 13px/90px sans-serif;text-align:center;color:#111}

/* ===== 静态近似示意 overlay ===== */
.o{position:absolute;inset:0;pointer-events:none}
.o-grid{background:linear-gradient(90deg,transparent 33%,rgba(255,255,255,.8) 33%,rgba(255,255,255,.8) 33.4%,transparent 33.4%,transparent 66.3%,rgba(255,255,255,.8) 66.3%,rgba(255,255,255,.8) 66.7%,transparent 66.7%),linear-gradient(0deg,transparent 33%,rgba(255,255,255,.8) 33%,rgba(255,255,255,.8) 33.4%,transparent 33.4%,transparent 66.3%,rgba(255,255,255,.8) 66.3%,rgba(255,255,255,.8) 66.7%,transparent 66.7%)}
.o-ots{background:radial-gradient(ellipse 45% 70% at 0% 100%,#000 55%,transparent 56%)}
.o-rem{background:linear-gradient(100deg,rgba(0,0,0,.78) 0,rgba(0,0,0,.78) 42%,rgba(0,0,0,0) 62%)}
.o-rim{box-shadow:inset 0 0 38px 6px rgba(255,225,190,.85)}
.o-hk{background:rgba(255,255,255,.28)}
.o-lk{background:radial-gradient(ellipse 45% 55% at 62% 38%,transparent 0,rgba(0,0,0,.85) 100%)}
.o-gold{background:linear-gradient(200deg,rgba(255,170,60,.55),rgba(255,90,30,.25));mix-blend-mode:soft-light}
.o-neon{background:linear-gradient(90deg,rgba(255,0,150,.5),transparent 50%,rgba(0,220,255,.5));mix-blend-mode:screen}
.o-vol{background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,240,200,.3) 22px 36px);-webkit-mask:linear-gradient(180deg,#000,transparent);mask:linear-gradient(180deg,#000,transparent)}
.o-3pt{background:radial-gradient(circle at 12% 20%,rgba(255,255,255,.4),transparent 40%),radial-gradient(circle at 88% 30%,rgba(120,170,255,.3),transparent 40%),radial-gradient(circle at 50% 0%,rgba(255,220,180,.35),transparent 45%)}
.o-to{background:linear-gradient(180deg,rgba(0,150,170,.55),rgba(255,140,40,.5));mix-blend-mode:overlay}
.o-grain{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1.2 -.2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;opacity:.9}
.o-bloom{background:radial-gradient(circle at 60% 35%,rgba(255,240,210,.75),transparent 45%);mix-blend-mode:screen;filter:blur(8px)}
.o-vig{background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 100%)}
.o-swiss{background:#f2f0ea;color:#111;padding:14px;font:900 30px/1 Helvetica,Arial,sans-serif}
.o-swiss i{position:absolute;right:0;top:0;bottom:0;width:34%;background:#e4002b}
.o-y2k{background:linear-gradient(135deg,#bdb4ff,#ffb3e6 50%,#9ff4ff);color:#fff;font:900 32px/1 Arial,sans-serif;text-shadow:0 0 6px #fff,2px 2px 0 #7a5cff;display:flex;align-items:center;justify-content:center}
.o-lines{background:repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px)}

/* ===== keyframes + demo classes（仅 .play 时运行）===== */
.play .a-zi{animation:zi 2.4s ease-in-out forwards}@keyframes zi{from{transform:scale(1)}to{transform:scale(1.55)}}
.play .a-zo{animation:zo 2.4s ease-in-out forwards}@keyframes zo{from{transform:scale(1.55)}to{transform:scale(1)}}
.play .a-pan{width:170%;animation:pan 2.6s ease-in-out forwards}@keyframes pan{to{transform:translateX(-41%)}}
.play .a-tilt{height:170%;animation:tilt 2.6s ease-in-out forwards}@keyframes tilt{to{transform:translateY(-41%)}}
.play .a-orbit{inset:12%;animation:orbit 2.8s ease-in-out forwards;border:2px solid #fff3}@keyframes orbit{from{transform:rotateY(-42deg)}to{transform:rotateY(42deg)}}
.play .a-wa{animation:wa .7s .6s cubic-bezier(.7,0,.3,1) forwards}@keyframes wa{0%{transform:none;filter:none}50%{filter:blur(14px)}100%{transform:translateX(-105%);filter:blur(14px)}}
.play .a-wb{transform:translateX(105%);animation:wb .7s .6s cubic-bezier(.7,0,.3,1) forwards}@keyframes wb{0%{transform:translateX(105%);filter:blur(14px)}60%{filter:blur(10px)}100%{transform:none;filter:none}}
.play .a-crash{animation:crash 1.6s ease-in forwards}@keyframes crash{0%,45%{transform:scale(1)}62%,100%{transform:scale(2.5)}}
.play .a-dzb{animation:dzb 2.6s ease-in-out forwards}@keyframes dzb{from{transform:scale(1)}to{transform:scale(1.8)}}
.play .a-dzf{animation:dzf 2.6s ease-in-out forwards}@keyframes dzf{from{transform:scale(1.5)}to{transform:scale(1)}}
.play .a-hand{animation:hand 2.4s linear forwards}@keyframes hand{0%{transform:scale(1.08) translate(0,0) rotate(0)}12%{transform:scale(1.08) translate(-6px,3px) rotate(-.6deg)}25%{transform:scale(1.08) translate(5px,-4px) rotate(.5deg)}40%{transform:scale(1.08) translate(-4px,-2px) rotate(-.4deg)}55%{transform:scale(1.08) translate(6px,4px) rotate(.7deg)}70%{transform:scale(1.08) translate(-5px,2px) rotate(-.5deg)}85%{transform:scale(1.08) translate(3px,-3px) rotate(.3deg)}100%{transform:scale(1.08)}}
.play .a-ra{animation:ra 2.4s ease-in-out forwards}@keyframes ra{0%,25%{filter:blur(0)}60%,100%{filter:blur(9px)}}
.play .a-rb{animation:rb 2.4s ease-in-out forwards}@keyframes rb{0%,25%{filter:blur(9px)}60%,100%{filter:blur(0)}}
.play .a-kb{animation:kb 4s linear forwards}@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.3) translate(-4%,-3%)}}
.play .a-d2{animation:fi 1.6s ease-in-out .5s forwards}@keyframes fi{from{opacity:0}to{opacity:1}}
.lay.hid{opacity:0}
.play .a-dipk{background:#000;opacity:0;animation:dipk 2s linear forwards}@keyframes dipk{0%{opacity:0}45%,55%{opacity:1}100%{opacity:0}}
.play .a-dipb{opacity:0;animation:dipb 2s steps(1) forwards}@keyframes dipb{0%,49%{opacity:0}50%,100%{opacity:1}}
.play .a-w2{clip-path:inset(0 100% 0 0);animation:w2 1.2s .4s ease-in-out forwards}@keyframes w2{to{clip-path:inset(0 0 0 0)}}
.play .a-zt1{animation:zt1 1.2s .4s ease-in forwards}@keyframes zt1{to{transform:scale(4);opacity:0}}
.play .a-zt2{opacity:0;animation:zt2 1.2s .4s ease-out forwards}@keyframes zt2{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.play .a-gl{animation:gl 1.2s steps(1) forwards}@keyframes gl{0%{transform:translate(0);filter:none}10%{transform:translate(-8px,2px);filter:hue-rotate(90deg) saturate(2);clip-path:inset(10% 0 60% 0)}20%{transform:translate(10px,-3px);clip-path:inset(55% 0 10% 0)}30%{transform:none;clip-path:none;filter:none}45%{transform:translate(-12px,0);filter:hue-rotate(-90deg);clip-path:inset(30% 0 40% 0)}60%{transform:translate(6px,3px);clip-path:none}75%{transform:translate(-4px,-2px);filter:invert(.2)}100%{transform:none;filter:none}}
.play .a-glb{background:repeating-linear-gradient(0deg,rgba(255,0,80,.25) 0 3px,rgba(0,255,255,.2) 3px 6px);opacity:0;animation:glb 1.2s steps(1) forwards}@keyframes glb{0%,100%{opacity:0}10%,20%,45%,60%{opacity:1}}
.play .a-mask{clip-path:inset(0 100% 0 0);animation:mask 1.2s .2s cubic-bezier(.7,0,.2,1) forwards}@keyframes mask{to{clip-path:inset(0 0 0 0)}}
.play .a-type{width:0;overflow:hidden;white-space:nowrap;border-right:3px solid #fff;font-family:ui-monospace,Menlo,monospace;animation:type 2s steps(12) forwards,caret .5s step-end 4}@keyframes type{to{width:12ch}}@keyframes caret{50%{border-color:transparent}}
.a-st span{display:inline-block}
.play .a-st span{opacity:0;animation:st .5s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(var(--i)*.09s)}@keyframes st{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.play .a-over{transform:scale(0);animation:over 1s cubic-bezier(.34,1.56,.64,1) .2s forwards}@keyframes over{to{transform:scale(1)}}
.play .a-pop{transform:scale(0);animation:pop .55s cubic-bezier(.2,1.6,.4,1) .2s forwards}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.lt{position:absolute;left:0;bottom:22px;background:var(--ac);color:#1a1205;padding:5px 16px 5px 12px;font-weight:800}
.lt small{display:block;font-weight:500;font-size:11px}
.play .a-lt{transform:translateX(-110%);animation:lt .7s cubic-bezier(.2,.9,.2,1) .2s forwards}@keyframes lt{to{transform:none}}
.play .a-blur{opacity:0;filter:blur(20px);animation:blur 1.2s ease-out .2s forwards}@keyframes blur{to{opacity:1;filter:blur(0)}}
.kar{background:linear-gradient(90deg,#ffd54a 50%,#fff 50%) 100% 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 3px #000)}
.play .a-kar{animation:kar 2.4s linear .2s forwards}@keyframes kar{to{background-position:0 0}}
.a-wbw span{margin:0 3px}
.play .a-wbw span{opacity:0;animation:fi .01s forwards;animation-delay:calc(var(--i)*.35s)}
.play .a-shake{animation:shake .6s linear 2}@keyframes shake{0%,100%{transform:translate(0)}10%{transform:translate(-9px,5px) rotate(-1deg)}20%{transform:translate(8px,-6px) rotate(1deg)}30%{transform:translate(-7px,-4px)}40%{transform:translate(9px,6px) rotate(.8deg)}50%{transform:translate(-5px,3px)}60%{transform:translate(6px,-5px) rotate(-.8deg)}70%{transform:translate(-4px,5px)}80%{transform:translate(4px,-3px)}90%{transform:translate(-2px,2px)}}
.rgb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 44px sans-serif;mix-blend-mode:screen}
.play .a-rr{color:#f00;animation:rr 1.4s ease-in-out forwards}@keyframes rr{0%,100%{transform:translateX(0)}40%,60%{transform:translateX(-9px)}}
.play .a-rg{color:#0f0}
.play .a-rbb{color:#00f;animation:rbb 1.4s ease-in-out forwards}@keyframes rbb{0%,100%{transform:translateX(0)}40%,60%{transform:translateX(9px)}}
.sweep{position:relative;overflow:hidden;font:900 40px sans-serif;color:#fff;padding:4px 10px}
.sweep::after{content:"";position:absolute;top:0;bottom:0;width:36%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.95),transparent);transform:skewX(-20deg)}
.play .sweep::after{animation:sw 1.4s ease-in-out .3s forwards}@keyframes sw{to{left:130%}}
.play .a-pix{animation:pix 1.6s steps(6) forwards}@keyframes pix{0%{filter:blur(0) contrast(1)}20%{filter:blur(5px) contrast(1.6) saturate(1.8)}60%{filter:blur(3px) contrast(1.4)}100%{filter:none}}
.mos{background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 14px),repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 1px,transparent 1px 14px);opacity:0}
.play .mos{animation:mos 1.6s steps(6) forwards}@keyframes mos{0%{opacity:0}20%,60%{opacity:1}100%{opacity:0}}
.play .a-e1{animation:em 2.4s linear forwards}.play .a-e2{animation:em 2.4s ease-in forwards}.play .a-e3{animation:em 2.4s ease-out forwards}.play .a-e4{animation:em 2.4s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes em{to{left:calc(100% - 22px)}}

/* ================= cut 剪接手法 ================= */
{id:"j-cut",cat:"cut",zh:"J 字剪辑（声音先入）",en:"J-Cut",alias:["J cut","声音提前"],desc:"下一段的声音先于画面进来。画面还在上一段时，观众已听到下一段声音，转场更顺。",use:"访谈、口播接场、对话自然衔接",demo:"tl:jcut",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=j+cut"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/J_cut"}],prompt:{hf:"(剪辑手法，多靠后期) 如需 AI 生成：audio of the next scene begins before the visual cut, ambient sound bridges the transition",hfZh:"下一场景的声音先于画面切入，用环境声衔接两个镜头",hyper:"/* 时间轴上让 B 段 audio 的 data-start 比 B 段 video 早 0.8 秒 */ <audio data-start='4.2' ...><video data-start='5.0' ...>",jy:"batch_edit：把 B 段音频轨起点前移 0.5～1s（视频轨不动）；音画分轨后用 set_clip_features 调；写入前先 dry_run",tested:"untested"}},
{id:"l-cut",cat:"cut",zh:"L 字剪辑（声音延后）",en:"L-Cut",alias:["L cut","声音延续"],desc:"画面已切到下一段，上一段的声音还继续。常用来在听对方说话时看听者反应。",use:"访谈听者反应、旁白盖过新画面",demo:"tl:lcut",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=l+cut"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/L_cut"}],prompt:{hf:"(剪辑手法，多靠后期) audio from the previous scene continues over the new visuals",hfZh:"上一场景的声音延续到新画面上",hyper:"/* A 段 audio 的 data-duration 比 A 段 video 长 1 秒，覆盖到 B 段开头 */",jy:"batch_edit：延长 A 段音频轨终点 0.5～1s，视频轨在原位切；dry_run 先看",tested:"untested"}},
{id:"match-cut",cat:"cut",zh:"匹配剪辑",en:"Match Cut",alias:["match cut","形似转场","图形匹配"],desc:"前后两镜在形状、动作或构图上相似，借相似性无缝跳到另一时空。",use:"创意转场、时间跳跃、品牌创意广告",demo:"tl:match",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=match+cut"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Match_cut"}],prompt:{hf:"match cut: the circular object in scene one is replaced by a similar circular object in scene two, same position and scale in frame",hfZh:"匹配剪辑：第一幕画面中的圆形物体，切到第二幕里位置大小相同的圆形物体",hyper:"/* 两段素材主体都用 #subject{left:50%;top:50%;width:30%} 对齐，再硬切 */",jy:"剪映内手动：靠素材拍摄/生成时对齐；剪映内用 关键帧→位置/缩放 微调对齐",tested:"untested"}},
{id:"jump-cut",cat:"cut",zh:"跳切",en:"Jump Cut",alias:["jump cut","跳接","同景别硬切"],desc:"同一镜头内直接剪掉一段，画面产生跳动。节奏快，现代 vlog 与口播常用。",use:"口播去空白、vlog、快节奏",demo:"tl:jump",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=jump+cut"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Jump_cut"}],prompt:{hf:"(剪辑手法) single static framing, subject repositioned slightly between each cut",hfZh:"同一机位同一景别，每次切换主体位置略有变化",hyper:"/* 同一素材分成多段，每段不同 data-media-start，data-start 首尾相接 */",jy:"ripple_delete（先用 ffmpeg silencedetect 找区间）；剪映内手动：放大 105% 交替缩放可掩盖跳感",tested:"untested"}},
{id:"cutaway",cat:"cut",zh:"插入镜头",en:"Cutaway / B-Roll",alias:["B-roll","cutaway","空镜插入","辅助画面"],desc:"在主线画面之间插入相关的辅助画面，音频不断。",use:"口播配画面、遮盖剪点、补充说明",demo:"tl:cutaway",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=b+roll"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/B-roll"}],prompt:{hf:"B-roll footage of the product in use, close-up details, supports the narration",hfZh:"产品使用中的辅助画面，近景细节，配合旁白",hyper:"/* 主视频 track 0；B-roll 放 track 1，data-start/duration 覆盖其上，主音频不动 */",jy:"create_draft 多轨：主轨口播，上轨 B-roll；批量用 batch_edit",tested:"untested"}},
{id:"smash-cut",cat:"cut",zh:"硬切反差",en:"Smash Cut",alias:["smash cut","突然切换"],desc:"在极安静（或极嘈杂）中突然切到截然相反的场景，制造冲击或笑点。",use:"喜剧反转、惊吓、节奏突变",demo:"tl:smash",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=smash+cut"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Smash_cut"}],prompt:{hf:"(剪辑手法) calm quiet scene, then abruptly the next scene is loud and chaotic",hfZh:"安静平稳的场景，随后突然切到喧闹混乱的场景",hyper:"/* 无转场，音频在切点突然升到 100%：gsap.set('#sfx',{volume:1}) */",jy:"批量：硬切无转场；音乐音量用 set_clip_features 在切点突升",tested:"untested"}},
{id:"beat-sync",cat:"cut",zh:"卡点",en:"Beat Sync / Cut on Beat",alias:["踩点","beat sync","音乐节拍剪辑"],desc:"让画面切换或动效对齐音乐的鼓点，节奏感强。",use:"短视频、宣传片、混剪",demo:"tl:beat",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=cut+on+beat+video+editing"},{t:"StudioBinder",u:"https://www.studiobinder.com/?s=cutting+on+beat"}],prompt:{hf:"(剪辑手法，AI 不负责) cuts landing on the beat of the music",hfZh:"画面切点落在音乐节拍上",hyper:"/* 先用 librosa/ffmpeg 取 beat 时间戳，data-start 全部取这些值：tl.add(()=>flash(),beatTimes[i]) */",jy:"剪映内手动：音频轨→踩点（自动标记节拍）；MCP 里用 ffmpeg 分析节拍后 batch_edit 对齐剪点",tested:"untested"}},
{id:"speed-ramp",cat:"cut",zh:"变速（速度渐变）",en:"Speed Ramp",alias:["speed ramping","时间重映射","time remap","曲线变速"],desc:"同一镜头内速度由慢变快或由快变慢，强调动作瞬间。",use:"动作镜头、转场前加速、运动/产品",demo:"ramp",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=speed+ramp"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=speed+ramp+effect+tutorial"}],prompt:{hf:"speed ramp, the motion starts in slow motion then accelerates rapidly to normal speed, dramatic timing",hfZh:"速度渐变，先慢动作后迅速加速回正常速度，节奏戏剧化",hyper:"/* 不要用 GSAP 改视频速度；先在 ffmpeg 里做 setpts 变速再引入 */",jy:"剪映内手动：选中片段→变速→曲线变速；MCP 工具不直接支持",tested:"untested"}},
{id:"tight-cut",cat:"cut",zh:"去停顿／紧凑剪辑",en:"Tight Cut",alias:["tight cut","去空白","remove silence","silence cut"],desc:"剪掉口播里的停顿、气口、口癖，让节奏紧凑。",use:"口播、访谈、教学视频",demo:"tl:tight",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=remove+silence+jump+cut+talking+head"},{t:"StudioBinder",u:"https://www.studiobinder.com/?s=pacing"}],prompt:{hf:"(剪辑手法，后期处理，AI 生成不适用)",hfZh:"这是后期手法，AI 生成时不适用",hyper:"/* 用 模板/客户案例-v2/tools/tight_cut.py（whisper 逐词切），产出 edl.json 后 build_index */",jy:"先 ffmpeg silencedetect（噪音大时改 tight_cut.py）找区间，再 ripple_delete 删除；写入先 dry_run",tested:"untested"}},

/* ================= transition 转场 ================= */
{id:"hard-cut",cat:"transition",zh:"直接切",en:"Hard Cut",alias:["cut","硬切","直切"],desc:"一帧直接换成另一帧，没有任何过渡，最常用也最干脆。",use:"默认转场、节奏快、对话",demo:"hardcut",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=hard+cut"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Cut_(transition)"}],prompt:{hf:"hard cut to the next shot, instant switch with no transition",hfZh:"直接硬切到下一个镜头，无任何过渡",hyper:"tl.set('#a',{opacity:0},5.0); tl.set('#b',{opacity:1},5.0)",jy:"无需转场：clips 首尾相接即可（create_draft / montage_create）",tested:"untested"}},
{id:"dissolve",cat:"transition",zh:"叠化／溶解",en:"Dissolve / Cross Fade",alias:["cross dissolve","叠化","淡入淡出叠加"],desc:"前一镜淡出的同时后一镜淡入，两画面重叠过渡，柔和。",use:"时间流逝、情绪缓和、回忆",demo:"diss",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=dissolve"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Dissolve_(filmmaking)"}],prompt:{hf:"smooth cross dissolve from scene one to scene two, soft overlap, 1 second",hfZh:"从场景一平滑叠化到场景二，柔和重叠，约 1 秒",hyper:"tl.to('#a',{opacity:0,duration:.8},5).fromTo('#b',{opacity:0},{opacity:1,duration:.8},5)",jy:"apply_native_resource(kind=transition, name=叠化)（默认 0.5s，重叠型）",tested:"untested"}},
{id:"dip-to-black",cat:"transition",zh:"黑场转场",en:"Dip to Black / Fade",alias:["fade to black","淡出到黑","dip to white"],desc:"画面渐暗到全黑，再从黑渐亮到下一场景，表示段落结束。",use:"章节结尾、时间跳跃、片尾",demo:"dip",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=fade+to+black"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Fade_(filmmaking)"}],prompt:{hf:"fade to black at the end of the scene, then fade in from black on the next scene",hfZh:"场景结尾渐黑，下一场景从黑场渐亮",hyper:"tl.to('#a',{opacity:0,duration:.6},5).fromTo('#b',{opacity:0},{opacity:1,duration:.6},5.6) /* 底层是黑背景 */",jy:"apply_native_resource：A 段「渐隐」(video_animation out)＋B 段「渐显」(in)；或 apply_motion_preset fade_out / fade_in",tested:"untested"}},
{id:"wipe",cat:"transition",zh:"划像／擦除",en:"Wipe",alias:["wipe","推出擦除","Star Wars wipe"],desc:"新画面沿一条边界线逐渐擦过旧画面。",use:"复古风、时间/地点切换、幻灯片",demo:"wipe",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=wipe+transition"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Wipe_(transition)"}],prompt:{hf:"left-to-right wipe transition, the new scene is revealed behind a moving edge",hfZh:"从左到右擦除转场，新场景随移动的边缘逐步显现",hyper:"gsap.fromTo('#b',{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:.8,ease:'power2.inOut'}) /* clip-path 已验证可用 */",jy:"剪映内手动：转场→遮罩转场/擦除类；或原生转场「右移」(push right) 近似",tested:"untested"}},
{id:"zoom-transition",cat:"transition",zh:"缩放转场",en:"Zoom Transition",alias:["zoom in transition","穿越转场","punch through"],desc:"前一镜急速放大穿过某个点，后一镜从放大状态收回，视觉上「穿过去」。",use:"节奏快、冲击感、科技感",demo:"zt",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=zoom+transition+tutorial"},{t:"StudioBinder",u:"https://www.studiobinder.com/?s=zoom+transition"}],prompt:{hf:"zoom transition, camera rapidly zooms into the scene and emerges into the next one, fast acceleration",hfZh:"缩放转场，镜头急速推进画面并穿出到下一场景，快速加速",hyper:"tl.to('#a',{scale:4,opacity:0,duration:.5,ease:'power3.in'},5).fromTo('#b',{scale:.4,opacity:0},{scale:1,opacity:1,duration:.5,ease:'power3.out'},5.1)",jy:"剪映内手动：转场→运镜转场→推近；MCP 可用 apply_motion_preset zoom_in＋fade_out 近似",tested:"untested"}},
{id:"glitch-transition",cat:"transition",zh:"故障转场",en:"Glitch Transition",alias:["glitch","故障风","数码干扰","datamosh"],desc:"画面短暂错位、色散、条纹闪烁，像信号故障，随后切到新画面。",use:"科技感、赛博、潮流短片",demo:"glitch",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=glitch+transition+tutorial"},{t:"Motionographer",u:"https://motionographer.com/?s=glitch"}],prompt:{hf:"glitch transition, digital signal distortion, RGB channel split, horizontal slice displacement, 0.4 seconds",hfZh:"故障转场，数码信号失真，RGB 通道分离，水平切片错位，约 0.4 秒",hyper:"tl.to('#a',{x:()=>gsap.utils.random(-12,12),duration:.05,repeat:6}) /* 用 steps 抖动＋clipPath 切片 */",jy:"剪映内手动：特效→画面特效→故障 / 转场→综艺·故障类",tested:"untested"}},
{id:"light-leak",cat:"transition",zh:"漏光转场",en:"Light Leak",alias:["light leak","漏光","胶片漏光"],desc:"暖色光斑从画面边缘漫入，遮住切点，温暖复古。",use:"回忆、旅行、婚礼、胶片风",demo:"leak",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=light+leak"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Light_leak"}],prompt:{hf:"warm orange light leak sweeping across the frame as a transition, film burn, soft glow",hfZh:"暖橙色漏光扫过画面作为转场，胶片烧灼，柔和光晕",hyper:"#leak{background:radial-gradient(ellipse at 20% 50%,#ff9628e6,#ff3c5a80 40%,transparent 70%);mix-blend-mode:screen} gsap.fromTo('#leak',{opacity:0,x:'-40%'},{opacity:1,x:0,duration:.6,yoyo:true,repeat:1})",jy:"剪映内手动：特效→画面特效→光 类；或素材叠加混合模式 滤色",tested:"untested"}},
{id:"mask-transition",cat:"transition",zh:"遮罩转场",en:"Mask Transition",alias:["mask reveal","形状转场","object wipe","matte transition"],desc:"用形状或画面内物体当遮罩，新画面从遮罩里长出来。",use:"创意转场、品牌图形、产品开场",demo:"wipe",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=mask+transition"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=mask+transition+video+editing"}],prompt:{hf:"mask transition, the next scene is revealed inside a circular mask that expands from the center",hfZh:"遮罩转场，下一场景从中心扩大的圆形遮罩里显现",hyper:"gsap.fromTo('#b',{clipPath:'circle(0% at 50% 50%)'},{clipPath:'circle(75% at 50% 50%)',duration:.9,ease:'power2.inOut'})",jy:"set_clip_features 设蒙版（圆形）＋缩放关键帧；或 剪映内手动：蒙版→圆形，关键帧",tested:"untested"}},

/* ================= mg MG字卡 ================= */
{id:"kinetic-typography",cat:"mg",zh:"动态文字排版",en:"Kinetic Typography",alias:["动态字","文字动画","kinetic type"],desc:"文字配合语音节奏运动、缩放、变色，文字本身成为画面主角。",use:"金句、宣言片头、歌词视频",demo:"kin",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=kinetic+typography"},{t:"Motionographer",u:"https://motionographer.com/?s=kinetic+typography"}],prompt:{hf:"kinetic typography, bold words pop in sync with the beat, scale and slide, high contrast text animation",hfZh:"动态文字排版，粗体字随节拍一个个弹出，缩放加滑入，高对比",hyper:"words.forEach((w,i)=>tl.from(w,{scale:0,y:30,duration:.35,ease:'back.out(2)'},t0+i*.28)) /* 时间对齐 tts_words.py 的逐词时间戳 */",jy:"剪映内手动：文字→入场动画；批量字幕用 add_srt＋style_subtitles；逐词弹出需手动",tested:"untested"}},
{id:"text-reveal",cat:"mg",zh:"遮罩文字揭示",en:"Text Reveal (Mask Wipe)",alias:["mask reveal","文字擦除","文字显现"],desc:"文字像被一条遮罩逐渐擦出来，干净利落，有高级感。",use:"标题入场、片头、关键词",demo:"mask",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=text+reveal"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=text+reveal+mask+animation"}],prompt:{hf:"title text revealed by a left-to-right mask wipe, clean smooth reveal, no bounce",hfZh:"标题文字由左向右遮罩擦出，干净平滑，无弹跳",hyper:"gsap.fromTo('#title',{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:.9,ease:'power3.inOut'})",jy:"剪映内手动：文字→动画→入场→向右擦除；或 apply_native_resource 文字「渐显」近似",tested:"untested"}},
{id:"typewriter",cat:"mg",zh:"打字机效果",en:"Typewriter",alias:["打字机","type on","逐字打出"],desc:"文字一个字符一个字符打出来，常带光标闪烁。",use:"终端风、对话框、悬疑揭示",demo:"type",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=typewriter"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=typewriter+text+animation"}],prompt:{hf:"typewriter effect, text appears one character at a time with a blinking cursor, monospace font",hfZh:"打字机效果，文字逐字出现并带闪烁光标，等宽字体",hyper:"chars.forEach((c,i)=>tl.set(c,{opacity:1},t0+i*.06)) /* 逐字 set，不动 letterSpacing */",jy:"剪映内手动：文字→动画→入场→打字机（或 逐字出现）；apply_native_resource 文字「渐显」近似",tested:"untested"}},
{id:"stagger",cat:"mg",zh:"错开入场",en:"Stagger",alias:["stagger","逐字错开","交错动画"],desc:"一组元素（字母、图标）不同时出场，按顺序依次错开几十毫秒，更有韵律。",use:"标题、列表项、图标组入场",demo:"stag",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=stagger"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=stagger+animation+motion+graphics"}],prompt:{hf:"letters appear one after another with a slight stagger, each rising from below and fading in",hfZh:"字母依次错开出现，每个从下方升起并渐显",hyper:"gsap.from('.ch',{y:24,opacity:0,duration:.5,stagger:.09,ease:'back.out(1.7)'})",jy:"剪映内手动：文字→动画→入场→逐字（如 逐字上升）；MCP 不逐字错开",tested:"untested"}},
{id:"overshoot-bounce",cat:"mg",zh:"过冲／回弹",en:"Overshoot / Bounce",alias:["overshoot","bounce","弹性","back ease"],desc:"元素超出目标位置再弹回，像有弹性，生动有活力。",use:"图标入场、按钮、卡通风 MG",demo:"over",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=overshoot"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=overshoot+animation+principle"}],prompt:{hf:"element pops in with overshoot bounce, scales past full size then settles, springy playful motion",hfZh:"元素带过冲回弹弹出，先放大过头再回落，弹性俏皮",hyper:"gsap.from('#icon',{scale:0,duration:.8,ease:'back.out(2.2)'}) /* 或 elastic.out(1,.4) */",jy:"apply_motion_preset(preset=pulse)（放大后恢复）近似；精确弹性需手动关键帧",tested:"untested"}},
{id:"split-flap",cat:"mg",zh:"翻牌／翻页计数",en:"Split-Flap / Flip Board",alias:["翻牌","机场显示牌","flip clock"],desc:"数字或字母像机场翻牌板一样逐格翻转切换。",use:"倒数、价格、时间、复古风格",demo:"flap",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=split+flap+display+animation"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Split-flap_display"}],prompt:{hf:"split-flap airport departure board animation, digits flip mechanically one by one",hfZh:"机场翻牌板动画，数字逐格机械翻转",hyper:"gsap.to('.fl',{rotationX:-90,duration:.25,stagger:.15,yoyo:true,repeat:1,ease:'power1.in'}) /* 父层 perspective */",jy:"剪映内手动：贴纸/文字素材；MCP 不原生支持",tested:"untested"}},
{id:"counter",cat:"mg",zh:"数字滚动",en:"Counter / Count-Up",alias:["count up","数字跳动","number roll"],desc:"数字从 0 逐步滚动到目标值，强调数据冲击。",use:"数据展示、成绩、业绩 KPI",demo:"counter",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=counter"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=count+up+number+animation"}],prompt:{hf:"animated number counter rolling up from zero to 1280, bold white digits on dark background",hfZh:"数字计数器从 0 滚动到 1280，深色背景粗白字",hyper:"gsap.to(obj,{v:1280,duration:2,ease:'power2.out',onUpdate:()=>el.textContent=Math.round(obj.v)}) /* 已验证做法：Registry count-up 元件，时长要改 3 处（见经验笔记坑 1） */",jy:"剪映内手动：文字→动画 数字滚动素材；MCP 用 add_srt 无法做数字滚动，改用 HyperFrames 渲染透明 MOV 叠加",tested:"untested"}},

{id:"scale-pop",cat:"mg",zh:"缩放弹出",en:"Scale Pop",alias:["pop in","弹出","scale up"],desc:"元素从 0 放大弹出，常稍微放大过头再回到 100%。",use:"强调关键词、数字、标签",demo:"pop",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=pop+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=scale+pop+animation+text"}],prompt:{hf:"text pops in with a quick scale-up, slight overshoot, snappy 0.3 second animation",hfZh:"文字快速放大弹出，略有过冲，利落的 0.3 秒动画",hyper:"gsap.fromTo('#word',{scale:0},{scale:1,duration:.35,ease:'back.out(2)'})",jy:"apply_motion_preset(preset=pulse)（放大后恢复）；apply_native_resource 文字入场",tested:"untested"}},
{id:"blur-in",cat:"mg",zh:"模糊渐入",en:"Blur In",alias:["模糊入场","focus in","blur reveal"],desc:"文字或元素从高度模糊、透明逐渐变清晰。",use:"柔和标题入场、梦幻/高级感",demo:"blur",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=blur+in"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=blur+in+text+animation"}],prompt:{hf:"text fades in from heavy blur to sharp focus, soft dreamy reveal",hfZh:"文字从严重模糊渐变清晰，柔和梦幻的显现",hyper:"gsap.fromTo('#title',{opacity:0,filter:'blur(20px)'},{opacity:1,filter:'blur(0px)',duration:1.2,ease:'power2.out'})",jy:"apply_native_resource：文字「渐显」(text_animation in)；模糊要手动加",tested:"untested"}},
{id:"outline-to-fill",cat:"mg",zh:"描边转填色",en:"Outline to Fill",alias:["描边填充","stroke to fill"],desc:"文字先只有轮廓线，再逐渐填满颜色。",use:"片头大标题、Y2K/潮流风",demo:"ofill",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=outline+text"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=outline+to+fill+text+animation"}],prompt:{hf:"text appears as thin outline first, then fills with solid color, bold sans-serif",hfZh:"文字先出现细轮廓，再填满实色，粗无衬线字体",hyper:"#t{-webkit-text-stroke:2px #fff;color:transparent} gsap.to('#t',{color:'#fff',duration:.8,delay:.5}) /* 动 color，不动 letterSpacing */",jy:"剪映内手动：文字→样式→描边，关键帧改文字颜色；MCP 暂不支持",tested:"untested"}},

{id:"bar-grow",cat:"mg",zh:"柱状图生长",en:"Bar Chart Grow",alias:["bar chart", "柱状图", "柱形增长", "bar grow"],desc:"柱子从基线依次向上生长，用高度对比直观展示数据大小与增长。",use:"业绩对比、月度增长、排名、销量数据",tag:"数据图表",demo:"bar-grow",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=bar+chart+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=bar+chart+animation+motion+graphics"}],prompt:{hf:"animated bar chart, bars growing upward one after another from the baseline, clean flat design, bold accent color, smooth ease-out, motion graphics data visualization",hfZh:"动画柱状图，柱子依次从基线向上生长，扁平简洁风格，强调色醒目，平滑缓出，数据可视化 MG",hyper:"gsap.from('.bar',{scaleY:0,transformOrigin:'bottom',duration:.7,stagger:.15,ease:'power3.out'}) /* 只动 transform */",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset；单纯推出可 apply_motion_preset(slide_up)",tested:"untested"}},
{id:"line-draw",cat:"mg",zh:"折线描绘",en:"Line Chart Draw",alias:["line chart", "折线图", "趋势线", "stroke draw"],desc:"折线像被一笔画出来，终点出现圆点，强调趋势与走向。",use:"增长趋势、股价、粉丝曲线、数据走势",tag:"数据图表",demo:"line-draw",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=line+chart+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=line+chart+animation+motion+graphics"}],prompt:{hf:"animated line chart, a smooth line drawing itself from left to right with a glowing dot at the tip, soft area fill fading in below, dark background, data trend",hfZh:"动画折线图，平滑曲线从左向右自行描绘，笔尖带发光圆点，下方柔和渐变面积淡入，深色背景，趋势数据",hyper:"gsap.fromTo('#ln',{strokeDashoffset:1},{strokeDashoffset:0,duration:1.8,ease:'power2.out'}) /* path 设 pathLength=1 与 stroke-dasharray=1；dashoffset 属 SVG 属性，需实测 lint */",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset",tested:"untested"}},
{id:"donut-sweep",cat:"mg",zh:"环形图扫入",en:"Donut Chart Sweep",alias:["donut chart", "环形图", "饼图", "pie sweep"],desc:"环形图的各段依次顺时针扫出，展示构成比例。",use:"占比构成、市场份额、预算分配、用户画像",tag:"数据图表",demo:"donut-sweep",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=donut+chart+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=donut+chart+animation+motion+graphics"}],prompt:{hf:"animated donut chart, colored segments sweeping clockwise one after another around a ring, center label with total, clean modern flat style",hfZh:"动画环形图，各色扇段依次顺时针扫出，中心显示总数标签，现代扁平风",hyper:"gsap.fromTo('.seg',{strokeDashoffset:100},{strokeDashoffset:0,duration:.9,stagger:.4,ease:'power2.out'}) /* 每段 circle pathLength=100 */",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset",tested:"untested"}},
{id:"progress-bar",cat:"mg",zh:"进度条",en:"Progress Bar",alias:["进度条", "loading bar", "progress fill", "完成度条"],desc:"一条横向进度条从 0 填充到目标值，旁边数字同步增加，表示完成度或达成率。",use:"目标达成、加载感、技能条、项目进度",tag:"数据图表",demo:"progress-bar",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=progress+bar+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=progress+bar+animation+motion+graphics"}],prompt:{hf:"animated horizontal progress bar filling from 0 to 78 percent with a percentage number counting up beside it, rounded bar, smooth ease",hfZh:"动画横向进度条从 0 填满到 78%，旁边百分比数字同步增长，圆角，缓动平滑",hyper:"gsap.fromTo('#fill',{scaleX:0},{scaleX:.78,transformOrigin:'left',duration:1.4,ease:'power2.out'}) /* 数字另用 onUpdate 写 textContent */",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset",tested:"untested"}},
{id:"kpi-tile",cat:"mg",zh:"KPI 数字卡",en:"KPI Tile",alias:["KPI", "数据卡", "数字卡片", "stat card"],desc:"一张卡片弹出，大数字滚动到目标值，下面是指标名称和涨幅标签。",use:"关键数据展示、年度总结、汇报开场",tag:"数据图表",demo:"kpi-tile",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=kpi+card+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=kpi+card+animation+motion+graphics"}],prompt:{hf:"animated KPI stat card popping in, large number counting up, small label below and a green percentage growth chip sliding in, minimal dark UI card",hfZh:"动画 KPI 数据卡弹出，大数字滚动增长，下方小字指标名，绿色涨幅标签滑入，极简深色 UI 卡片",hyper:"tl.from('#tile',{scale:.6,opacity:0,duration:.5,ease:'back.out(1.8)'}).from('#chip',{x:-20,opacity:0,duration:.4},'-=.1') /* 数字滚动用 onUpdate */",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset",tested:"untested"}},

{id:"compare-bars",cat:"mg",zh:"对比条",en:"Comparison Bars",alias:["comparison bars", "我们 vs 他们", "对比柱", "versus bars"],desc:"两条或多条横向条从左长出，高亮的一条代表自家，直观对比差距。",use:"产品对比、竞品对照、前后数据差",tag:"数据图表",demo:"compare-bars",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=comparison+chart+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=comparison+chart+animation+motion+graphics"}],prompt:{hf:"animated comparison bars, two horizontal bars growing from the left, our bar highlighted in bright accent color and much longer than the gray competitor bar, value labels at the end",hfZh:"动画对比条，两条横向条从左长出，我方条用强调色高亮且明显更长，对方为灰色，末端显示数值",hyper:"tl.from('.cmp',{scaleX:0,transformOrigin:'left',duration:.9,stagger:.25,ease:'power3.out'})",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset",tested:"untested"}},
{id:"table-reveal",cat:"mg",zh:"表格逐行显示",en:"Table Row Reveal",alias:["table reveal", "表格动画", "逐行出现", "row stagger"],desc:"表头先出，数据行逐行滑入，最后高亮关键行，信息清楚有层次。",use:"规格参数、价格表、套餐对比、排行榜",tag:"数据图表",demo:"table-reveal",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=table+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=table+animation+motion+graphics"}],prompt:{hf:"animated data table, header row fading in first, data rows sliding in one by one with a slight delay, the key row highlighted at the end, clean grid lines",hfZh:"动画数据表格，表头先淡入，数据行依次延迟滑入，最后高亮关键行，线条干净",hyper:"tl.from('.tr',{x:-24,opacity:0,duration:.4,stagger:.2,ease:'power2.out'}).to('.tr.hl',{backgroundColor:'#ffb454',duration:.3})",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset",tested:"untested"}},
{id:"before-after",cat:"mg",zh:"前后对比滑杆",en:"Before / After Slider",alias:["before after", "对比滑杆", "前后对比", "comparison slider"],desc:"一条分割线在画面上左右扫动，一侧是「前」一侧是「后」，直观展示改善效果。",use:"装修、修图、护肤、清洁、效果证明",tag:"产品说明",demo:"before-after",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=before+after+slider"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=before+after+slider+motion+graphics"}],prompt:{hf:"before and after comparison, a vertical divider line sweeping across the frame, left side the original dull version and right side the improved vibrant version, labels Before and After",hfZh:"前后对比，一条竖直分割线扫过画面，一侧是原始暗淡版，另一侧是改善后鲜艳版，带「前」「后」标签",hyper:"gsap.fromTo('#after',{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:1.8,ease:'power2.inOut'}) /* 分割线同时动 xPercent */",jy:"剪映内手动：叠加两层，上层加蒙版（线性）并给蒙版位置打关键帧；MCP 不支持蒙版动画，需手动",tested:"untested"}},
{id:"callout-label",cat:"mg",zh:"产品标注线",en:"Callout Label Line",alias:["callout", "标注线", "产品标注", "annotation line"],desc:"在产品上的一个点出现圆点，引出一条线，线端出现文字，说明该部位的特点。",use:"产品功能点标注、结构说明、爆炸图",tag:"产品说明",demo:"callout-label",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=callout+lines+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=callout+lines+animation+motion+graphics"}],prompt:{hf:"product callout animation, a small dot pulsing on the product, a thin line extending from it, then a text label popping at the end of the line, repeated for two features, clean minimal style",hfZh:"产品标注动画，产品上一个小圆点脉冲出现，引出一条细线，线端弹出文字标签，重复两处特点，极简风格",hyper:"tl.from('.dot',{scale:0,duration:.3,ease:'back.out(3)'}).from('.line',{scaleX:0,transformOrigin:'left',duration:.4}).from('.lab',{opacity:0,x:-8,duration:.3})",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset",tested:"untested"}},
{id:"step-flow",cat:"mg",zh:"步骤流程 1-2-3",en:"Step Flow",alias:["step flow", "三步流程", "流程图", "numbered steps"],desc:"编号圆圈依次点亮，连接线逐段画出，每一步配一行说明。",use:"使用步骤、购买流程、服务流程",tag:"产品说明",demo:"step-flow",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=step+process+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=step+process+animation+motion+graphics"}],prompt:{hf:"animated 3-step process, numbered circles 1, 2, 3 lighting up one by one, connecting lines drawing between them, short caption fading in under each step",hfZh:"动画三步流程，编号圆圈 1、2、3 依次点亮，之间连接线逐段画出，每步下方淡入简短说明",hyper:"tl.from('.node',{scale:0,duration:.35,stagger:.5,ease:'back.out(2)'}).from('.link',{scaleX:0,transformOrigin:'left',duration:.4,stagger:.5},0.2)",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset",tested:"untested"}},
{id:"bullet-reveal",cat:"mg",zh:"要点逐条出现",en:"Bullet Reveal",alias:["bullet reveal", "要点列表", "逐条显示", "list stagger"],desc:"几条要点一条接一条滑入，前面带圆点，配合口播节奏。",use:"卖点罗列、特色介绍、总结页",tag:"产品说明",demo:"bullet-reveal",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=bullet+points+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=bullet+points+animation+motion+graphics"}],prompt:{hf:"animated bullet points, three key points sliding in from the left one after another, each with an accent dot, text aligned to voiceover pace, clean typography",hfZh:"动画要点列表，三条要点从左依次滑入，各带强调色圆点，节奏对齐口播，字体干净",hyper:"gsap.from('.bl',{x:-30,opacity:0,duration:.5,stagger:.45,ease:'power3.out'}) /* 时间对齐 tts_words.py 的句首时间戳 */",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset；逐条出现可用字幕分段（add_srt）＋入场动画手动",tested:"untested"}},
{id:"icon-pop",cat:"mg",zh:"图标加说明弹出",en:"Icon + Label Pop",alias:["icon pop", "图标弹出", "icon label", "卖点图标"],desc:"图标先带过冲弹出，下面说明文字随后淡入，几组之间错开。",use:"卖点图标、功能亮点、服务特色",tag:"产品说明",demo:"icon-pop",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=icon+animation+pop"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=icon+animation+pop+motion+graphics"}],prompt:{hf:"animated feature icons, three round icons popping in with overshoot one by one, each with a short text label fading in below, flat colorful style",hfZh:"动画功能图标，三个圆形图标依次带过冲弹出，各自下方淡入简短文字标签，扁平多彩风",hyper:"tl.from('.ic',{scale:0,duration:.5,stagger:.3,ease:'back.out(2.4)'}).from('.lb',{opacity:0,y:8,duration:.3,stagger:.3},.3)",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset；单个弹出可 apply_motion_preset(pulse) 近似",tested:"untested"}},
{id:"magnify-highlight",cat:"mg",zh:"局部放大圈",en:"Magnify Highlight",alias:["magnify", "放大镜", "局部放大", "zoom lens highlight"],desc:"画面上出现一个圆圈放大镜，移动到细节并放大该处，引导观众看重点。",use:"产品细节、材质、屏幕界面某处、文字重点",tag:"产品说明",demo:"magnify",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=magnify+zoom+callout"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=magnify+zoom+callout+motion+graphics"}],prompt:{hf:"magnifier highlight on a product detail, a circular lens popping in and sliding over the key area, content inside the lens enlarged, thin white ring border with soft shadow",hfZh:"产品细节放大圈，圆形放大镜弹出并滑到重点区域，镜内内容被放大，细白色圆环边框带柔和阴影",hyper:"tl.from('#lens',{scale:0,duration:.4,ease:'back.out(2)'}).to('#lens',{x:60,y:-20,duration:1,ease:'power2.inOut'})",jy:"剪映内手动：复制素材一层放大，加蒙版（圆形）并给位置打关键帧；MCP 蒙版动画需手动",tested:"untested"}},
{id:"arrow-flow",cat:"mg",zh:"流程箭头描绘",en:"Arrow Flow",alias:["arrow flow", "箭头流程", "流向箭头", "process arrows"],desc:"节点之间的箭头线条逐段画出并带箭头，表示流向、因果或转化路径。",use:"流程说明、转化漏斗、数据流向、因果关系",tag:"产品说明",demo:"arrow-flow",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=arrow+flow+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=arrow+flow+animation+motion+graphics"}],prompt:{hf:"animated flow diagram, three boxes connected by lines that draw themselves with arrowheads popping at the end, boxes appearing in sequence, minimal flat design",hfZh:"动画流程图，三个方框之间连线自行画出并在末端弹出箭头，方框依次出现，极简扁平",hyper:"tl.from('.box',{scale:.7,opacity:0,duration:.4,stagger:.6}).fromTo('.arrow',{strokeDashoffset:1},{strokeDashoffset:0,duration:.5,stagger:.6},.3)",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset",tested:"untested"}},
{id:"feature-grid",cat:"mg",zh:"四宫格功能卡",en:"Feature Grid",alias:["feature grid", "功能宫格", "卖点格", "bento grid"],desc:"四张功能卡片按顺序缩放淡入，每张含图标与名称，一屏讲清多个卖点。",use:"产品功能总览、App 介绍、套餐亮点",tag:"产品说明",demo:"feature-grid",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=feature+grid+animation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=feature+grid+animation+motion+graphics"}],prompt:{hf:"animated 2x2 feature grid, four rounded cards scaling and fading in one by one, each with an icon and short title, soft shadows, consistent spacing, bento style",hfZh:"动画 2x2 功能宫格，四张圆角卡片依次缩放淡入，各含图标与短标题，柔和阴影，间距统一，便当盒风格",hyper:"gsap.from('.fc',{scale:.8,opacity:0,y:12,duration:.45,stagger:.2,ease:'back.out(1.6)'})",jy:"剪映多数要手动；图表类建议用 HyperFrames 渲染透明 MOV（ProRes 4444，11.5 已验证可叠加）再 create_draft 叠到视频轨；整体入场可用 apply_motion_preset",tested:"untested"}},

/* ================= subtitle 字幕样式 ================= */
{id:"sub-pop",cat:"subtitle",zh:"弹出字幕",en:"Pop Subtitle",alias:["弹跳字幕","pop caption"],desc:"每句字幕出现时带轻微缩放弹出，短视频常用。",use:"短视频口播、强调语气",demo:"sub-pop",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=pop+caption+animation+short+video"},{t:"StudioBinder",u:"https://www.studiobinder.com/?s=subtitles"}],prompt:{hf:"(字幕，建议后期加) bold subtitle pops in with a quick scale bounce at the bottom center",hfZh:"粗体字幕在底部居中弹出，轻快缩放",hyper:"gsap.fromTo('.cap',{scale:.6,opacity:0},{scale:1,opacity:1,duration:.25,ease:'back.out(2)'})",jy:"add_srt 导入字幕，style_subtitles 设字级（中文 52）；弹出动画剪映内手动：文字→动画→入场→弹入",tested:"untested"}},
{id:"sub-karaoke",cat:"subtitle",zh:"逐字高亮（卡拉OK）",en:"Karaoke Highlight",alias:["karaoke","逐字变色","字幕高亮"],desc:"字幕随语音逐字（词）变色，视线跟着声音走。",use:"口播、歌词、教学跟读",demo:"karaoke",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=karaoke+caption+animation"},{t:"StudioBinder",u:"https://www.studiobinder.com/?s=captions"}],prompt:{hf:"(字幕，建议后期加) subtitle words highlight in yellow one by one in sync with the voice",hfZh:"字幕随语音逐词变黄高亮",hyper:"words.forEach((w,i)=>tl.to(w,{color:'#ffd54a',duration:.05},wordStart[i])) /* wordStart 来自 tts_words.py */",jy:"剪映内手动：文字→动画→循环/入场→卡拉OK；或字幕轨 style_subtitles 设色后手动逐词",tested:"untested"}},
{id:"sub-word",cat:"subtitle",zh:"逐词跳出",en:"Word-by-Word Subtitle",alias:["word by word","逐词出现","TikTok 字幕"],desc:"一次只出现一个词或一小段，换词时画面几乎不留残影，节奏感强。",use:"TikTok/Reels 口播、快节奏",demo:"wbw",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=word+by+word+captions+tiktok"},{t:"StudioBinder",u:"https://www.studiobinder.com/?s=captions"}],prompt:{hf:"(字幕，建议后期加) one large word at a time appears in the center, replaced by the next word in rhythm with speech",hfZh:"每次只在画面中央出现一个大字，随语速被下一个词取代",hyper:"words.forEach((w,i)=>{tl.set(w,{opacity:1},s[i]); tl.set(w,{opacity:0},s[i+1])}) /* s=逐词开始时间 */",jy:"add_srt 按词切行再 style_subtitles；剪映内手动：识别字幕→按词断句",tested:"untested"}},
{id:"sub-bar",cat:"subtitle",zh:"底框条字幕",en:"Caption Bar",alias:["字幕底条","bar caption","半透明底"],desc:"字幕下加半透明色条，保证任何背景上都清晰可读。",use:"复杂背景、新闻风、长句字幕",demo:"sub-bar",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=subtitles"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=subtitle+background+box+style"}],prompt:{hf:"(字幕，建议后期加) white subtitle on a semi-transparent black bar at the bottom",hfZh:"白色字幕配半透明黑色底条，位于画面下方",hyper:".cap{background:rgba(0,0,0,.6);padding:4px 14px;border-radius:6px}",jy:"style_subtitles（背景色/不透明度参数）；或剪映内手动：文字→文本→背景",tested:"untested"}},
{id:"sub-stroke",cat:"subtitle",zh:"描边／阴影字幕",en:"Stroke & Shadow Subtitle",alias:["描边字幕","outline subtitle","drop shadow"],desc:"白字加黑色描边与阴影，在各种背景上都可读，不遮挡画面。",use:"通用字幕、影视、旅行 vlog",demo:"sub-stroke",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=subtitles"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=subtitle+outline+shadow+style"}],prompt:{hf:"(字幕，建议后期加) white subtitle with thick black outline and soft drop shadow",hfZh:"白色字幕加粗黑色描边和柔和投影",hyper:".cap{-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 2px 6px #000}",jy:"style_subtitles（描边/阴影）；中文字级 52、英文 32 已验证（经验笔记坑 15）",tested:"untested"}},
{id:"sub-bilingual",cat:"subtitle",zh:"双语上下排",en:"Bilingual Subtitles",alias:["中英字幕","双语字幕","dual subtitle"],desc:"上排中文、下排英文（或相反），中文大、英文小。",use:"外语内容、跨境客户案例、门店英文版",demo:"sub-bi",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=subtitles"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=bilingual+subtitles+video"}],prompt:{hf:"(字幕，建议后期加) two-line bilingual subtitle, Chinese on top in larger font, English below in smaller font",hfZh:"双语两行字幕，上行中文较大，下行英文较小",hyper:".cap .zh{font-size:52px} .cap .en{font-size:32px;opacity:.9} /* 中文 52／英文 32 */",jy:"add_srt 导入中文轨与英文轨（两条字幕轨），style_subtitles 分别设字级 52／32",tested:"untested"}},

/* ================= comp 去背合成 ================= */
{id:"chroma-key",cat:"comp",zh:"绿幕抠像",en:"Chroma Key",alias:["green screen", "绿幕", "色度键", "chromakey"],desc:"拍摄时背景是纯绿（或蓝），后期把这个颜色变成透明，换成别的背景。前景人物留下，绿色消失。",use:"人物口播换背景、虚拟场景、特效人物合成",demo:"chroma",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=Chroma+key"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=chroma+key+green+screen+tutorial"}],prompt:{hf:"subject standing in front of a solid green background, evenly lit green screen, no shadows on the backdrop, no green clothing, sharp focus, ready for chroma keying",hfZh:"人物站在纯绿幕前，绿幕均匀打光，背景上无阴影，人物不穿绿色，对焦清晰，便于后期抠像。也可用 Higgsfield MCP 的 remove_background 直接去背",hyper:"#fg{mix-blend-mode:normal} /* 实际抠像用 canvas/WebGL 的 chroma 着色器；纯 CSS 近似：背景图 + 前景透明 PNG */",jy:"剪映内手动：选中素材→画面→抠像→色度抠图→取色器点绿幕→调强度、阴影；剪映菜单路径【11.5 待核对】",tested:"untested"}},
{id:"ai-matting",cat:"comp",zh:"一键去背（智能抠像）",en:"AI Matting / Background Removal",alias:["智能抠像", "自动去背", "portrait segmentation", "remove background"],desc:"AI 自动识别人像并分离背景，不需要绿幕，效果取决于边缘与光线。",use:"没有绿幕时的人物去背、换背景、叠文字在人物后面",demo:"aimat",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=Image+segmentation"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=ai+background+removal+video"}],prompt:{hf:"clean cutout of the person, remove the background, transparent background PNG with soft natural edges. Use the Higgsfield MCP remove_background tool on the source image, or generate the subject on a solid green background.",hfZh:"人物干净去背，透明背景 PNG，边缘自然柔和。可对原图用 Higgsfield MCP 的 remove_background 工具，或让 AI 在纯绿背景上生成主体",hyper:"#fg{-webkit-mask-image:url(cutout.png);mask-image:url(cutout.png)} /* 去背后的 PNG／带 alpha 的 webm 直接叠加 */",jy:"剪映内手动：选中素材→画面→抠像→智能抠像（或 蒙版→人像）；剪映菜单路径【11.5 待核对】",tested:"untested"}},
{id:"luma-key",cat:"comp",zh:"亮度键",en:"Luma Key",alias:["luma key", "亮度抠像", "去黑底", "screen blend"],desc:"按亮度而不是颜色抠：把画面里最暗（或最亮）的部分变透明。黑底的火焰、烟雾、光效素材常用。",use:"黑底特效素材叠加（火、烟、光）、白底文字",demo:"luma",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=Luma+key"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=luma+key+black+background+overlay"}],prompt:{hf:"glowing fire embers floating on a pure black background, high contrast, no background detail, ready to be keyed with a luma key or screen blend",hfZh:"黑色纯底上飘浮发光的火星，高对比，背景无细节，方便用亮度键或滤色模式抠出",hyper:".fx{mix-blend-mode:screen} /* 黑底素材直接 screen；白底用 multiply */",jy:"剪映内手动：叠加素材→混合模式→滤色（黑底去黑）；或 画面→抠像→色度抠图取黑色；剪映菜单路径【11.5 待核对】",tested:"untested"}},
{id:"shape-mask",cat:"comp",zh:"形状遮罩",en:"Shape Mask",alias:["蒙版", "圆形遮罩", "矩形蒙版", "mask shape"],desc:"用圆、矩形、心形等形状限定画面可见区域，形状之外是下层素材或透明。",use:"圆形头像、聚焦某区域、画中画造型、转场",demo:"shape",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=Mask+(computing)"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=shape+mask+video+editing"}],prompt:{hf:"circular crop of the subject, soft rounded frame, subject centered inside the shape, background replaced by a plain color",hfZh:"主体做圆形裁切，柔和圆角框，主体居中于形状内，背景换成纯色",hyper:"#fg{clip-path:circle(30% at 50% 50%)} /* 或 inset(15% 20% round 12px)；mask-image 也可 */",jy:"剪映内手动：选中素材→画面→蒙版→线性／镜面／圆形／矩形／爱心；MCP set_clip_features 可加蒙版；剪映菜单路径【11.5 待核对】",tested:"untested"}},
{id:"feather-edge",cat:"comp",zh:"羽化边缘",en:"Feather / Soft Edge",alias:["羽化", "边缘柔化", "soft edge", "feathering"],desc:"让遮罩边缘由实变虚，过渡更自然，避免合成后生硬的描边感。左边羽化 0，右边羽化大。",use:"蒙版边缘融合、抠像后修边、渐隐边框",demo:"feather",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=Feathering"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=mask+feather+edge+video"}],prompt:{hf:"subject cutout with softly feathered edges, gentle gradient transition into the background, no hard outline",hfZh:"主体抠像边缘带柔和羽化，与背景之间渐变过渡，无生硬描边",hyper:"#fg{-webkit-mask-image:radial-gradient(circle,#000 25%,transparent 62%);mask-image:radial-gradient(circle,#000 25%,transparent 62%)}",jy:"剪映内手动：画面→蒙版→羽化滑杆（向右加大）；抠像后可再用 边缘处理；剪映菜单路径【11.5 待核对】",tested:"untested"}},
{id:"track-matte",cat:"comp",zh:"轨道遮罩",en:"Track Matte / Alpha Matte",alias:["alpha matte", "轨道蒙版", "文字镂空", "text fill video"],desc:"用一个层的透明度或亮度当另一层的显示范围，最常见是把视频填进文字里。",use:"视频填字、片头镂空文字、图形揭示",demo:"matte",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=Matte+(filmmaking)"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=track+matte+text+video+fill"}],prompt:{hf:"bold title text filled with moving footage, text acts as a matte revealing video inside the letters, dark background",hfZh:"粗体标题，文字里填充流动的视频画面，文字作为遮罩露出内部视频，深色背景",hyper:".t{background:url(clip.jpg) center/cover;-webkit-background-clip:text;background-clip:text;color:transparent} /* 动画移动 backgroundPosition 属非 transform，需实测 */",jy:"剪映内手动：文字层放上，视频层放下，混合模式／蒙版→文字（类似「文字镂空」模板）；原生不完整支持；剪映菜单路径【11.5 待核对】",tested:"untested"}},
{id:"rotoscope",cat:"comp",zh:"手动描边抠像",en:"Rotoscoping",alias:["rotoscope", "roto", "逐帧描边", "手绘遮罩"],desc:"逐帧（或关键帧）手动描出主体轮廓做遮罩，没有绿幕时精确去背的传统做法，耗时但最可控。",use:"复杂背景下精确去背、局部特效、AI 抠像失败时补救",demo:"roto",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=Rotoscoping"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=rotoscoping+tutorial+video"}],prompt:{hf:"clean isolated subject with a precise hand-traced outline mask, sharp edges, consistent mask across frames. Prefer AI segmentation first via the Higgsfield MCP remove_background tool.",hfZh:"主体被精确手动描边遮罩，边缘锐利，逐帧遮罩一致。建议先用 Higgsfield MCP 的 remove_background 试 AI 分割，失败再手动",hyper:"/* 不适合 HyperFrames 手动 roto：用已去背素材 */ #fg{clip-path:polygon(...)} /* 可用 polygon 近似静态轮廓 */",jy:"剪映内手动：蒙版→自定义（钢笔）逐帧调节点并打关键帧；MCP 不支持，耗时；剪映菜单路径【11.5 待核对】",tested:"untested"}},
{id:"spill-suppress",cat:"comp",zh:"绿溢色去除",en:"Green Spill Suppression",alias:["despill", "去溢色", "边缘绿光", "spill removal"],desc:"绿幕的绿光会反射到人物边缘（头发、肩膀）出现绿边，去溢色把这些绿色去掉或换成背景色。",use:"绿幕抠像后修边、头发边缘、浅色衣服",demo:"spill",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=Chroma+key"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=despill+green+screen+spill+suppression"}],prompt:{hf:"green screen subject lit with a separate hair light and kept at least 2 meters from the backdrop to reduce green spill on the edges, no green reflections on skin or clothing",hfZh:"绿幕人物用单独发光，并离背景至少 2 米以减少边缘绿溢色，皮肤与衣服上无绿色反光",hyper:"#fg{filter:drop-shadow(0 0 0 transparent)} /* 实际用着色器：把绿色通道压到 min(r,b) 以内；CSS 无法完整实现 */",jy:"剪映内手动：色度抠图中调高「边缘清除／阴影」，必要时 调节→HSL 压低绿色饱和度；剪映菜单路径【11.5 待核对】",tested:"untested"}},
{id:"light-wrap",cat:"comp",zh:"边缘融光",en:"Light Wrap",alias:["light wrap", "光包裹", "环境光溢入", "edge blend"],desc:"把背景的亮色轻轻「包」到前景边缘，使人物与新背景融为一体，不像贴上去的。",use:"换背景后让人物更自然、逆光场景合成",demo:"wrap",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=Compositing"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=light+wrap+compositing+tutorial"}],prompt:{hf:"subject composited into a bright sunset background, warm background light wrapping softly around the edges of the subject, natural blended look",hfZh:"人物合成到明亮日落背景中，背景暖光柔和包裹人物边缘，自然融合",hyper:"#fg{filter:drop-shadow(-3px 0 6px rgba(255,200,120,.9))} /* 近似：用背景色做边缘投影 */",jy:"剪映内手动：复制前景层，模糊后叠加（混合模式：滤色）并蒙版限制在边缘；或 调节→色温使前景接近背景；剪映菜单路径【11.5 待核对】",tested:"untested"}},
{id:"shadow-comp",cat:"comp",zh:"合成阴影",en:"Shadow / Contact Shadow",alias:["drop shadow comp", "接触阴影", "假阴影", "grounding shadow"],desc:"合成后人物像飘在背景上，补一个地面阴影（压扁、模糊、半透明的黑影）让人物「站」在地上。",use:"换背景后的接地感、产品落地、虚拟场景",demo:"shadowc",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=Compositing"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=compositing+shadow+matching+tutorial"}],prompt:{hf:"subject standing on the ground with a soft contact shadow beneath the feet and a longer cast shadow matching the light direction, grounded and natural",hfZh:"人物站在地面上，脚下有柔和接触阴影并带与光向一致的投影，贴地自然",hyper:"#sh{background:#000;border-radius:50%;filter:blur(8px);opacity:.5;transform:scaleY(.25)} /* 压扁的模糊黑椭圆放在脚下 */",jy:"剪映内手动：复制前景层，亮度压黑、模糊、蒙版压扁后放脚下（混合模式 正片叠底）；剪映菜单路径【11.5 待核对】",tested:"untested"}},
{id:"pip",cat:"comp",zh:"画中画",en:"Picture-in-Picture",alias:["PiP", "画中画", "小窗叠加", "inset video"],desc:"一个小画面叠在主画面一角，常用于主播头像、示范画面、对话分屏。",use:"口播叠示范、会议截图＋头像、对比、反应视频",demo:"pip",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=Picture-in-picture"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=picture+in+picture+video+editing+tutorial"}],prompt:{hf:"picture in picture layout, a small rounded inset window of the presenter in the bottom right corner over a full-screen demo, thin white border and soft shadow",hfZh:"画中画布局，全屏演示画面上，右下角叠一个带圆角的小窗显示主讲人，细白边框与柔和阴影",hyper:"#pip{position:absolute;right:24px;bottom:24px;width:28%;border-radius:12px;box-shadow:0 6px 20px #0008} gsap.from('#pip',{scale:.6,opacity:0,duration:.5,ease:'back.out(1.6)'})",jy:"jianying-local 多轨：副轨素材设 scale≈0.3＋position（create_draft／batch_edit 的 clip 属性）；画面→基础→缩放／位置 手动也可；剪映菜单路径【11.5 待核对】",tested:"untested"}},

/* ================= fx 特效 ================= */
{id:"shake",cat:"fx",zh:"震动",en:"Shake",alias:["camera shake","抖动","震屏"],desc:"画面短促剧烈抖动，模拟冲击、爆炸、重击。",use:"重击/落地、卡点强调、冲击音效",demo:"shake",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=camera+shake+effect+tutorial"},{t:"StudioBinder",u:"https://www.studiobinder.com/?s=camera+shake"}],prompt:{hf:"violent camera shake on impact, short 0.5 second intense shake, then settles",hfZh:"冲击时画面剧烈震动，持续约 0.5 秒后恢复稳定",hyper:"gsap.to('#shot',{x:'random(-9,9)',y:'random(-6,6)',rotation:'random(-1,1)',duration:.05,repeat:10}) ; gsap.set('#shot',{x:0,y:0,rotation:0}) /* 结束归位 */",jy:"剪映内手动：特效→画面特效→基础→抖动／震动；时长对齐冲击音效",tested:"untested"}},
{id:"zoom-punch",cat:"fx",zh:"放大冲击",en:"Zoom Punch",alias:["punch in","脉冲放大","beat zoom"],desc:"画面在重拍点瞬间放大几个百分点再回落，加强节奏感。",use:"卡点、口播强调、鼓点",demo:"over",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=zoom+punch+effect"},{t:"StudioBinder",u:"https://www.studiobinder.com/?s=punch+in"}],prompt:{hf:"quick punch-in zoom of 10 percent on the beat, snaps back, rhythmic pulse",hfZh:"在节拍点快速放大 10% 再弹回，有节奏的脉冲",hyper:"beats.forEach(b=>tl.fromTo('#shot',{scale:1},{scale:1.1,duration:.12,yoyo:true,repeat:1,ease:'power2.out'},b))",jy:"apply_motion_preset(preset=pulse)（放大后恢复）；多个节拍用 batch_edit 批量加",tested:"untested"}},
{id:"rgb-split",cat:"fx",zh:"RGB 色散／色差",en:"RGB Split / Chromatic Aberration",alias:["chromatic aberration","色差","RGB shift","RGB分离"],desc:"红绿蓝通道略微错位，边缘出现彩色拖边，数码/故障/科技感。",use:"故障风、强调、赛博朋克",demo:"rgb",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=rgb+split+effect+tutorial"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Chromatic_aberration"}],prompt:{hf:"chromatic aberration, RGB channel split with red and blue fringes at the edges, glitchy digital look",hfZh:"色差效果，RGB 通道分离，边缘出现红蓝彩边，数码故障质感",hyper:"/* 三层同素材：mix-blend-mode:screen，红层 x:-9，蓝层 x:+9 */ gsap.to('#r',{x:-9,duration:.3,yoyo:true,repeat:1})",jy:"剪映内手动：特效→画面特效→RGB分离（或 色差）；强度对齐音效点",tested:"untested"}},
{id:"light-sweep",cat:"fx",zh:"扫光",en:"Light Sweep / Shine",alias:["shine","扫光效果","光泽划过"],desc:"一道斜向亮光从文字或 logo 上划过，质感、高级感。",use:"logo 揭示、标题、产品按钮",demo:"sweep",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=shine+effect"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=light+sweep+shine+text+animation"}],prompt:{hf:"a diagonal light sweep passes across the logo, glossy shine, premium reveal",hfZh:"一道斜向光泽扫过 logo，亮面质感，高级揭示",hyper:"gsap.fromTo('#shine',{x:'-150%'},{x:'330%',duration:1.1,ease:'power2.inOut'}) /* #shine 为 skewX(-20deg) 的白色渐变条，overflow:hidden */",jy:"剪映内手动：特效→画面特效→扫光（或 光效 素材 滤色叠加）",tested:"untested"}},
{id:"particles",cat:"fx",zh:"粒子",en:"Particles",alias:["particle","光点","飘浮粒子","dust"],desc:"许多小光点或尘埃飘动，增加空间氛围与层次。",use:"氛围、魔法/科技感、背景质感",demo:"part",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=particles"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=floating+particles+overlay+effect"}],prompt:{hf:"floating golden dust particles drifting upward in warm light, bokeh sparkles, atmospheric depth",hfZh:"金色微尘在暖光中向上飘浮，散景光点，增加空间层次",hyper:"gsap.to('.pt',{y:-190,x:'random(-30,30)',opacity:0,duration:2.2,stagger:.18,repeat:-1,ease:'none'})",jy:"剪映内手动：特效→画面特效→飘落／粒子；或 叠加粒子素材（混合模式 滤色）",tested:"untested"}},
{id:"lens-flare",cat:"fx",zh:"镜头光晕",en:"Lens Flare",alias:["flare","炫光","光斑"],desc:"强光进入镜头产生光斑与光晕。",use:"阳光感、科幻、转场点缀",demo:"flare",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=lens+flare"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Lens_flare"}],prompt:{hf:"anamorphic lens flare sweeping across the frame, bright sun glare with horizontal streaks",hfZh:"变形宽银幕镜头光晕扫过画面，强烈日光眩光，横向光条",hyper:"#flare{background:radial-gradient(circle,#fffffff2,#ffc87880 10%,transparent 28%);mix-blend-mode:screen} gsap.fromTo('#flare',{x:-60,y:-30,opacity:0},{x:260,y:110,opacity:1,duration:2,yoyo:true,repeat:1})",jy:"剪映内手动：特效→画面特效→光 类；或叠加炫光素材（滤色）",tested:"untested"}},
{id:"slow-mo",cat:"fx",zh:"慢动作",en:"Slow Motion",alias:["slow motion","升格","慢镜头"],desc:"以高帧率拍摄、低速播放，让动作细腻延展，强调瞬间。",use:"倒茶、水花、表情、产品细节",demo:"slow",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=slow+motion"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Slow_motion"}],prompt:{hf:"slow motion 120fps, liquid droplets suspended in air, smooth fluid motion, detailed",hfZh:"120 帧慢动作，水滴悬在半空，流畅细腻，细节清晰",hyper:"/* 素材先用 ffmpeg setpts=2.0*PTS 变慢（minterpolate 补帧）后再引入，不用 GSAP 改视频速度 */",jy:"剪映内手动：选中片段→变速→常规变速（0.3x～0.5x）；MCP 工具暂不直接支持变速",tested:"untested"}},
{id:"pixelate",cat:"fx",zh:"马赛克／像素化",en:"Pixelate",alias:["mosaic","像素化","8-bit"],desc:"画面分解成方块，常用于转场或隐藏信息。近似示意：模糊＋网格。",use:"转场、隐私遮挡、复古游戏风",demo:"pix",ref:[{t:"YouTube",u:"https://www.youtube.com/results?search_query=pixelate+transition+effect"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Pixelation"}],prompt:{hf:"pixelate transition, the image breaks into large mosaic blocks then resolves into the next scene, 8-bit style",hfZh:"像素化转场，画面分解成大块马赛克后切到下一场景，8-bit 风格",hyper:"/* CSS 无真像素化；用 SVG feFlood+feComposite 或预烘 transition 视频，filter:blur 仅近似 */",jy:"剪映内手动：特效→画面特效→马赛克／像素；或 转场→像素化类",tested:"untested"}},

/* ================= rhythm 节奏 ================= */
{id:"easing",cat:"rhythm",zh:"缓动曲线",en:"Easing",alias:["ease in out","缓入缓出","spring","时间曲线"],desc:"物体运动的加减速方式：线性、先慢后快、先快后慢、弹簧。同一位移，感觉完全不同。",use:"所有动效——决定「像不像真的」",demo:"ease",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=easing"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Inbetweening"}],prompt:{hf:"smooth ease-in-out motion, gentle acceleration then deceleration, natural feel, no linear mechanical movement",hfZh:"平滑的缓入缓出，先轻柔加速再减速，运动自然，不要机械匀速",hyper:"gsap.to('#ball',{x:300,duration:2,ease:'power2.out'}) /* 常用：power2.out（入场）power2.in（离场）back.out（弹）；已验证 */",jy:"剪映内手动：关键帧→选中关键帧→缓入/缓出；apply_motion_preset 的 easing 固定为 linear，需手动改",tested:"untested"}},
{id:"anticipation",cat:"rhythm",zh:"预备动作",en:"Anticipation",alias:["蓄力","预备","anticipation"],desc:"动作开始前先反向小幅动一下（蓄力），再主动作，更有力。",use:"跳跃、弹出、冲刺、重要入场",demo:"ant",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=anticipation"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation"}],prompt:{hf:"the subject crouches slightly before leaping forward, anticipation before the main action",hfZh:"主体先微微下蹲蓄力，再向前跃出，主动作前有预备",hyper:"tl.to('#obj',{x:-30,duration:.3,ease:'power2.out'}).to('#obj',{x:420,duration:.5,ease:'power4.in'})",jy:"剪映内手动：关键帧第一个点反向小位移，再打主位移",tested:"untested"}},
{id:"follow-through",cat:"rhythm",zh:"跟随／余韵",en:"Follow-Through",alias:["follow through","惯性回弹","overlapping action"],desc:"主动作结束后元素因惯性小幅越过再回稳，更真实。",use:"落地、停止、入场收尾",demo:"fol",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=follow+through"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation"}],prompt:{hf:"after stopping, the object wobbles slightly and settles, natural inertia and follow-through",hfZh:"停止后物体轻微晃动再稳定，自然的惯性余韵",hyper:"gsap.to('#obj',{x:420,duration:.9,ease:'elastic.out(1,.35)'})",jy:"剪映内手动：在终点后加 2～3 个递减关键帧",tested:"untested"}},
{id:"hold",cat:"rhythm",zh:"停顿／定格保持",en:"Hold",alias:["hold","停留","留白节奏","beat of silence"],desc:"动作完成后让画面静止一小段，给观众阅读与消化的时间。",use:"字卡阅读、情绪停留、金句后",demo:"hold",ref:[{t:"School of Motion",u:"https://www.schoolofmotion.com/search?q=hold+frames"},{t:"StudioBinder",u:"https://www.studiobinder.com/?s=pacing"}],prompt:{hf:"the camera holds on the subject in stillness for a moment before the next action",hfZh:"镜头在主体上静止停留片刻，再进入下一个动作",hyper:"tl.to('#obj',{x:300,duration:.8}).to('#obj',{x:300,duration:1.2}) /* 空补间＝hold；字卡至少停留字数×0.25s */",jy:"剪映内手动：把片段时长延长，或加 定格（右键→定格）；batch_edit 可批量延长末段",tested:"untested"}},
{id:"pacing",cat:"rhythm",zh:"节奏快慢",en:"Pacing",alias:["pacing","剪辑节奏","镜头长度"],desc:"镜头平均长度决定节奏：快（0.5～2 秒）紧张兴奋，慢（4 秒以上）舒缓抒情。",use:"规划整支片的情绪曲线",demo:"pace",ref:[{t:"StudioBinder",u:"https://www.studiobinder.com/?s=pacing"},{t:"Wikipedia",u:"https://en.wikipedia.org/wiki/Film_editing"}],prompt:{hf:"fast-paced sequence of quick cuts, each shot lasting one second",hfZh:"快节奏连续短切，每个镜头约一秒",hyper:"/* 客户案例 7 段骨架：开场 3s 抓人，主体每段 6～10s，片尾 4s；字卡不少于字数×0.25s */",jy:"montage_create 的 clips 时长即节奏；批量调时长用 batch_edit（另存新版本）",tested:"untested"}},

{id:"safe-area",cat:"size",zh:"安全区（平台 UI 遮挡）",en:"Safe Area / Safe Zone",alias:["安全框","字幕安全区","title safe","UI 遮挡"],desc:"画面里不会被平台按钮、标题、进度条挡住的区域。竖屏上方、下方、右侧都有遮挡，重要文字要放进中间。",use:"竖屏字幕、字卡、LOGO、二维码位置规划",demo:"size:safe",ref:[{t:"Wikipedia",u:"https://en.wikipedia.org/w/index.php?search=safe+area+television"},{t:"YouTube",u:"https://www.youtube.com/results?search_query=短视频+安全区+字幕+位置"}],prompt:{hf:"vertical 9:16 composition, key subject in the central safe area, empty space reserved at the top 8% and bottom 20% of the frame",hfZh:"9:16 竖构图，主体放在中央安全区，画面上方约 8%、下方约 20% 留空",hyper:"padding:140px 130px 350px 40px /* 1080x1920 约值：上 7%、下 18%、右 12%；各平台不同，待核对 */ 字卡容器全部放进这个内框",jy:"create_draft 文字 clip 默认 y=-0.75（归一化坐标）偏下，竖屏会压进底部 UI 区；建议 y 取约 -0.5，先 dry_run 再在剪映里肉眼核对（待核对）；批量改位置用 style_subtitles(style={y:...})",tested:"untested"}},

function lightDemo(k,c){
  const e=LIGHT[k],rad=Math.PI/180,amb=e.amb||'#16181e';
  const bgs={dark:'linear-gradient(#10131a,#07080b)',bright:'linear-gradient(#f2f4f8,#cfd5de)',window:'linear-gradient(90deg,#cfe3ff 0,#9bbbe3 9%,#12151b 36%)'};
  const bg=bgs[e.bg||'dark'];
  const key=e.L.find(l=>'kw'.includes(l[0])&&Math.cos(l[1]*rad)>-.35);
  const sph=(left,top,s,hard,tag)=>{
    const obj=e.shape==='obj',w=obj?s*.62:s,h=obj?s*1.1:s,kk=s/118;
    const ly=e.L.map(([ty,az,el,it,sz,col])=>{
      const a=az*rad,c2=col||'255,240,220',elv=el*Math.PI/2;
      if(Math.cos(a)<-.35)return `radial-gradient(circle at 50% 50%,transparent ${obj?44:54}%,rgba(${c2},${it}) 63%,rgba(${c2},${it*.3}) 71%,transparent 79%)`;
      const x=50+48*Math.sin(a)*Math.cos(elv),y=50-48*Math.sin(elv),R=Math.round(s*(hard>=.65?.9:hard>=.3?1.2:1.6)*(sz||1));
      const st=hard>=.65?`rgba(${c2},${it}) 0,rgba(${c2},${it*.85}) 50%,rgba(${c2},${it*.25}) 62%,rgba(${c2},0) 72%`:hard>=.3?`rgba(${c2},${it}) 0,rgba(${c2},${it*.75}) 38%,rgba(${c2},${it*.3}) 65%,rgba(${c2},0) 100%`:`rgba(${c2},${it}) 0,rgba(${c2},${it*.6}) 40%,rgba(${c2},${it*.2}) 75%,rgba(${c2},0) 100%`;
      return `radial-gradient(circle ${R}px at ${x}% ${y}%,${st})`;
    });
    let top1='',inner='';
    if(key){const a=key[1]*rad,elv=key[2]*Math.PI/2,sx=Math.sin(a)*Math.cos(elv),sy=Math.sin(elv);
      /* 暗部：以主光为中心，远端压暗（terminator） */
      top1+=`radial-gradient(circle ${Math.round(s*1.25)}px at ${50+48*sx}% ${50-48*sy}%,transparent 38%,rgba(0,0,0,.35) 62%,rgba(0,0,0,.72) 100%),`;
      /* 高光点 */
      top1+=`radial-gradient(circle ${Math.max(4,Math.round(s*.07))}px at ${50+30*sx}% ${50-30*sy}%,rgba(255,255,255,.6),rgba(255,255,255,0) 100%),`;
      if(!obj){const tx=(e.turn||0)*w*.12;
        inner=`<i class="nsh" style="left:calc(50% + ${tx-sx*9*kk}px);top:calc(54% + ${sy*9*kk+3*kk}px);width:${11*kk}px;height:${13*kk}px"></i><i class="nose" style="left:calc(50% + ${tx}px);top:52%;width:${13*kk}px;height:${17*kk}px"></i>`;}}
    const br=obj?'38% 38% 14% 14%/24% 24% 14% 14%':'50%';
    const dk=e.bg==='bright'?.4:.7;
    const csh=`<div class="csh" style="left:${left+w*.08}px;top:${top+h-h*.05}px;width:${w*.84}px;height:${Math.max(8,s*.12)}px;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,${dk}) 0,rgba(0,0,0,${dk*.5}) 45%,transparent 72%)"></div>`;
    return csh+`<div class="sph" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px;border-radius:${br};background:${top1}${ly.join(',')},${amb}">${inner}${e.sheen&&!tag?'<i class="sheen"></i>':''}</div>`;
  };
  let sp,sz=e.shape==='obj'?122:118;
  if(c){
    if(e.cmp)sp=sph(6,10,52,.95)+sph(6,80,52,.05)+`<div class="stl" style="left:6px;top:62px;width:52px">硬光</div><div class="stl" style="left:6px;top:132px;width:52px">软光</div>`;
    else if(e.shape==='obj')sp=sph(18,48,66,e.hard);
    else sp=sph(4,48,70,e.hard);
  }else if(e.cmp){sp=sph(10,36,78,.95)+sph(96,36,78,.05)+`<div class="stl" style="left:10px;top:122px;width:78px">硬光</div><div class="stl" style="left:96px;top:122px;width:78px">软光</div>`;}
  else if(e.shape==='obj')sp=sph(40,30,122,e.hard);
  else sp=sph(22,28,118,e.hard);
  /* 俯视图：相机在下，主体在 (60,54)，灯按方位角分布 */
  const cx=60,cy=54,R=38;let g='';
  e.L.forEach(([ty,az,el,it,sz,col])=>{
    const a=az*rad;let lx=cx+R*Math.sin(a),ly=cy+R*Math.cos(a),lab={k:'主光',f:'补光',r:'轮廓光',w:'窗',c:'反光板'}[ty],r=4.5+(sz||1)*2.2;
    const colr={k:'#ffc46b',f:'#8cc8ff',r:'#ff8f70',w:'#ffe066',c:'#f2f4f8'}[ty];
    let shp;
    if(el>=.95||el<=-.95){lx=cx;ly=cy;shp=`<circle cx="${lx}" cy="${ly}" r="15" fill="none" stroke="${colr}" stroke-width="1.5" stroke-dasharray="3 2"/><circle cx="${lx}" cy="${ly}" r="3" fill="${colr}"/><text x="${lx}" y="${ly-19}" text-anchor="middle" font-size="10" font-weight="700" fill="${colr}">${el>0?'▲ 正上方':'▼ 正下方'}</text>`;}
    else if(ty==='c'||ty==='w'){shp=`<rect x="${lx-10}" y="${ly-2.5}" width="20" height="5" rx="1" transform="rotate(${-az} ${lx} ${ly})" fill="${ty==='c'?'none':colr}" stroke="${colr}" stroke-dasharray="${ty==='c'?'2 1.5':'0'}"/><line x1="${lx}" y1="${ly}" x2="${cx+(lx-cx)*.35}" y2="${cy+(ly-cy)*.35}" stroke="${colr}" stroke-dasharray="2 2" opacity=".8"/>`;}
    else shp=`<line x1="${lx}" y1="${ly}" x2="${cx+(lx-cx)*.32}" y2="${cy+(ly-cy)*.32}" stroke="${colr}" stroke-dasharray="2 2"/><circle cx="${lx}" cy="${ly}" r="${r}" fill="${colr}" fill-opacity=".25" stroke="${colr}" stroke-width="1.5"/><circle cx="${lx}" cy="${ly}" r="${r/2.4}" fill="${colr}"/>`;
    const tyy=ly+(ly>cy?r+11:-r-3);
    if(!(el>=.95||el<=-.95))shp+=`<text x="${Math.min(100,Math.max(20,lx))}" y="${Math.min(100,Math.max(11,tyy))}" text-anchor="middle" font-size="10" font-weight="700" fill="${colr}">${lab}${Math.abs(el)>=.6?(el>0?' 高位':' 低位'):''}</text>`;
    g+=shp;
  });
  const cam=`<g transform="translate(60,108)"><rect x="-9" y="-4" width="18" height="9" rx="2" fill="#f2f4f8"/><path d="M-4 -4 L0 -11 L4 -4Z" fill="#f2f4f8"/></g><text x="74" y="114" font-size="10" font-weight="700" fill="#c9d1de">相机</text>`;
  const subj=e.shape==='obj'?`<rect x="54" y="47" width="12" height="14" rx="3" fill="#f2f4f8"/>`:`<circle cx="${cx}" cy="${cy}" r="7" fill="#f2f4f8"/><path d="M${cx-2.5} ${cy+7.5} L${cx} ${cy+11.5} L${cx+2.5} ${cy+7.5}Z" fill="#f2f4f8" transform="rotate(${(e.turn||0)*-35} ${cx} ${cy})"/>`;
  const svg=`<svg class="lg" width="${c?98:134}" height="${c?101:128}" viewBox="0 0 120 124"><rect x="0" y="0" width="120" height="124" rx="8" fill="#0c0e12" stroke="#2a2f3a"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#2a2f3a" stroke-dasharray="1.5 3"/>${subj}${g}${cam}</svg>`;
  return `<div class="lm${c?' c':''}" style="background:${bg}">${sp}${svg}<div class="lbl">${e.lbl}</div></div>${c?'':'<span class="badge">布光示意（俯视图）</span>'}`;
}
