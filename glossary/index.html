   leading:()=>w('',`<span class="ftl">行距 leading：左 1.0　右 1.7</span><div class="fab"><div class="fsans" style="line-height:1;font-size:12px">行距太紧时，上下两行的字几乎挤在一起，阅读起来很吃力。</div><div class="fsans" style="line-height:1.7;font-size:12px">行距适当时，每行之间有呼吸感，阅读起来轻松很多。</div></div><small>字幕 1.2–1.4，正文 1.5–1.8</small>`),
   scale:()=>w('',`<span class="ftl">字号层级：标题 : 正文 : 注解 ≈ 3 : 1.5 : 1</span><div class="fsans" style="font-size:33px;font-weight:800;line-height:1.1">主标题 33</div><div class="fsans" style="font-size:16px">正文说明文字 16</div><div class="fsans" style="font-size:11px;color:#7a808c">注解、来源、免责声明 11</div>`),
   mix:()=>w('',`<span class="ftl">中英混排：左无间距　右留细空格＋英文用 Inter</span><div class="fab"><div class="fsans" style="font-size:17px;font-weight:700;line-height:1.5">品牌做剪辑2026年用了3个AI</div><div style="font-family:Inter,'PingFang SC',sans-serif;font-size:17px;font-weight:700;line-height:1.5">品牌 做剪辑，2026 年用了 3 个 AI</div></div><small>中文与英文／数字之间留半角空格，数字用英文字体更整齐</small>`),
   pair:()=>w('',`<span class="ftl">字体配对：标题宋体＋正文黑体</span><div class="fserif" style="font-size:30px;font-weight:700;line-height:1.15">慢工出细活</div><div class="fsans" style="font-size:13px;line-height:1.6">一条视频最多用两种字体：一种负责个性，一种负责阅读，字重与大小拉开对比。</div>`),
   free:()=>w('',`<span class="ftl" style="color:#ffb454">可商用字体（授权请自行核对）</span>${[['阿里巴巴普惠体','免费商用'],['思源黑体／思源宋体','OFL 开源'],['Inter','OFL 开源'],['得意黑 Smiley Sans','OFL 开源'],['站酷系列（快乐体／酷黑等）','授权请自行核对']].map(([a,b])=>`<div class="fsans fnow" style="font-size:12.5px;line-height:1.35">${a}　<small style="color:#8a93a3">${b}</small></div>`).join('')}`,1)
  };
  return (F[k]||F.sans)()+'<span class="badge">实际字体样张</span>';
}
const bdots=a=>a.map(([x,y,s,c,f])=>`<i style="left:${x}%;top:${y}%;width:${s}%;height:${s*(f||1)}%;background:${c}"></i>`).join('');
const EYESH=bdots([[36.5,47,14,'rgba(70,40,60,.5);filter:blur(3px)',.45],[48.5,47,14,'rgba(70,40,60,.5);filter:blur(3px)',.45]]);
const BEAUTY={
 smooth:{a:'blur(1.4px) brightness(1.07) contrast(.95)'},
 whiten:{a:'brightness(1.2) saturate(.88)'},
 slim:{at:'scaleX(.93)'},
 eyes:{at:'scale(1.08)'},
 acne:{ob:bdots([[40,57,2.6,'rgba(185,60,60,.85)'],[60,54,2.6,'rgba(185,60,60,.85)'],[51,37,2.2,'rgba(185,60,60,.85)'],[44,62,2.2,'rgba(150,70,60,.8)']]),a:'brightness(1.02)'},
 dark:{ob:EYESH,a:'brightness(1.02)'},
 bright:{a:'brightness(1.1) contrast(1.12)',oa:bdots([[42.5,43.5,1.8,'rgba(255,255,255,.9)'],[54.5,43.5,1.8,'rgba(255,255,255,.9)']])},
 makeup:{a:'saturate(1.2)',oa:bdots([[44,56.5,12,'rgba(210,70,90,.6);filter:blur(1px)',.28],[31,52,14,'rgba(255,110,130,.35);filter:blur(5px)',1],[55,52,14,'rgba(255,110,130,.35);filter:blur(5px)',1]])},
 body:{at:'scaleX(.88)'},
 tone:{b:'saturate(1.3) contrast(1.06) hue-rotate(-8deg)',a:'saturate(.85) brightness(1.04) sepia(.08)'},
 enhance:{b:'blur(1.5px) contrast(.86) saturate(.9)',a:'contrast(1.1) saturate(1.12)'},
 denoise:{grain:1,a:'contrast(1.08)'}
};
function beautyDemo(k){
  const e=BEAUTY[k]||{};
  return `<div class="bw"><div class="bfl"><div class="bimg" style="filter:${e.b||'none'}">${e.ob||''}</div>${e.grain?'<div class="o o-grain" style="opacity:1"></div>':''}<span class="btag" style="left:6px">原图</span></div><div class="bfl af"><div class="bimg" style="filter:${e.a||'none'};transform:${e.at||'none'}">${e.oa||''}</div><span class="btag" style="right:6px">修后·近似示意</span></div><div class="bdiv"></div><input class="bsl" type="range" min="0" max="100" value="50" aria-label="对比滑杆" oninput="this.parentNode.style.setProperty('--p',this.value+'%')"></div><span class="badge" style="top:auto;bottom:20px;right:6px">近似示意（CSS 滤镜）</span>`;
}
function buildDemo(name,c){
  if(name&&name.startsWith('size:'))return sizeDemo(name.slice(5));
  if(name&&name.startsWith('font:'))return fontDemo(name.slice(5));
  if(name&&name.startsWith('beauty:'))return beautyDemo(name.slice(7));
  if(name&&name.startsWith('still:')){const [s,o,h]=STILL[name.slice(6)];
    return `<div class="lay img" style="${s}"></div>${o?`<div class="o ${o}">${h}</div>`:`<div class="o">${h}</div>`}${c?'':'<span class="badge">近似示意</span>'}`;}
  if(name&&name.startsWith('tl:')){const k=name.slice(3),rows=['V2','V1','A1'];
    const used=rows.filter(r=>TL[k].some(s=>s[0]===r));
    return `<div class="tl">${used.map(r=>`<div class="row"><i>${r}</i>${TL[k].filter(s=>s[0]===r).map(s=>`<div class="seg ${s[3]}" style="left:${s[1]}%;width:${s[2]}%">${s[4]}</div>`).join('')}</div>`).join('')}<div class="ph"></div><div class="tlcap">${TLCAP[k]}</div></div>`;}
  if(name&&name.startsWith('light:'))return lightDemo(name.slice(6),c);
  return (DEMO[name]||(()=>I()))();
}
function runCounters(box){box.querySelectorAll('.cnt').forEach(el=>{const to=+el.dataset.to,t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/2000);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
function play(box){box.classList.remove('play');void box.offsetWidth;box.classList.add('play');runCounters(box)}

/* ================= render ================= */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const catName=Object.fromEntries(CATS);
let cur='all';
let FAV=new Set();
try{FAV=new Set(JSON.parse(localStorage.getItem('glossary-fav')||'[]'))}catch(e){}
function saveFav(){try{localStorage.setItem('glossary-fav',JSON.stringify([...FAV]))}catch(e){}}
function tabLabel(k,n){return k==='fav'?`★ 收藏（${FAV.size}）`:n}
function card(t){
  const demo=t.clip?`<video src="${t.clip}" controls loop muted></video>`:t.img?`<div class="split"><div class="phot"><img src="${t.img}" alt="${esc(t.zh)}" loading="lazy" onerror="this.style.display='none'"><span class="badge">AI 实拍示意</span></div><div class="rp">${buildDemo(t.demo,1)}</div></div>`:buildDemo(t.demo);
  const on=FAV.has(t.id);
  return `<article class="card${on?' fav':''}" id="t-${t.id}"><button class="fav-btn" type="button" data-id="${t.id}" title="收藏" aria-label="收藏">${on?'★':'☆'}</button><div class="catn">${catName[t.cat]} · ${t.id}${t.tag?`<span class="tagc">${t.tag}</span>`:''}</div>
  <h2>${esc(t.zh)}<small>${esc(t.en)}</small></h2>
  <div class="chips">${t.alias.map(a=>`<span>${esc(a)}</span>`).join('')}</div>
  <div class="desc">${esc(t.desc)}</div><div class="use"><b>用途：</b>${esc(t.use)}</div>
  <div class="demowrap"><div class="demo">${demo}</div><button class="rep" type="button">▶ 重播</button></div>
  <details><summary>指令写法</summary>
   <div class="pr"><div class="k">Higgsfield prompt（EN）</div><code>${esc(t.prompt.hf)}</code></div>
   <div class="pr"><div class="k">中文写法</div><code>${esc(t.prompt.hfZh)}</code></div>
   <div class="pr"><div class="k">HyperFrames CSS / GSAP</div><code>${esc(t.prompt.hyper)}</code></div>
   <div class="pr"><div class="k">剪映 MCP</div><code>${esc(t.prompt.jy)}</code></div>
   <div class="tg">实测状态：${t.prompt.tested}</div></details>
  <div class="refs">参考：${t.ref.map(r=>`<a href="${r.u}" target="_blank" rel="noopener">${esc(r.t)}</a>`).join('')}</div></article>`;
}
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const ci=k=>CATS.findIndex(c=>c[0]===k);
  const list=TERMS.filter(t=>(cur==='all'||(cur==='fav'?FAV.has(t.id):t.cat===cur))&&(!q||[t.zh,t.en,t.alias.join(' '),t.desc].join(' ').toLowerCase().includes(q))).sort((a,b)=>ci(a.cat)-ci(b.cat));/* 稳定排序：按 CATS 顺序，同类保持 TERMS 内顺序 */
  const g=document.getElementById('grid');
  const bar=cur==='fav'?`<div class="favbar"><button type="button" id="favcopy">复制收藏清单</button><span id="favmsg">共 ${FAV.size} 条；复制格式：中文 / English，每行一条</span></div>`:'';
  const note=cur==='beauty'?`<div class="catnote">MCP 目前不能自动美颜（jianying-local／jianying-ai 均无美颜、磨皮、瘦脸参数）：需先建草稿并发布，再在剪映里手动处理。下方对比图为 CSS 近似示意，非真实算法效果。</div>`:'';
  g.innerHTML=bar+note+(list.length?list.map(card).join(''):`<div class="empty">${cur==='fav'?'还没有收藏，点卡片右上角 ☆ 加入':'没有符合的术语'}</div>`);
  document.getElementById('cnt').textContent=`（${list.length} / ${TERMS.length}）`;
  g.querySelectorAll('.demo').forEach(d=>play(d));
}
document.getElementById('tabs').innerHTML=CATS.map(([k,n])=>`<button type="button" data-k="${k}" class="${k==='all'?'on':''}">${tabLabel(k,n)}</button>`).join('');
function copyFav(){
  const txt=TERMS.filter(t=>FAV.has(t.id)).map(t=>t.zh+' / '+t.en).join('\n'),m=document.getElementById('favmsg');
  const done=ok=>{if(m)m.textContent=ok?`已复制 ${FAV.size} 条`:'复制失败，请手动选取'};
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();done(ok)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>done(true),fb);else fb();
}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.k;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));render()};
document.getElementById('q').oninput=render;
document.getElementById('grid').onclick=e=>{
  const fb=e.target.closest('.fav-btn');
  if(fb){const id=fb.dataset.id;FAV.has(id)?FAV.delete(id):FAV.add(id);saveFav();
    document.querySelector('#tabs [data-k="fav"]').textContent=tabLabel('fav');
    if(cur==='fav'){render();return}
    const c=fb.closest('.card'),on=FAV.has(id);c.classList.toggle('fav',on);fb.textContent=on?'★':'☆';return}
  if(e.target.id==='favcopy'){copyFav();return}
  const b=e.target.closest('.rep');if(b)play(b.parentNode.querySelector('.demo'))};
render();
</script>
</body>
</html>
